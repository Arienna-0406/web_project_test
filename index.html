<!-- 站点初始化（替代原 init.js 的站点创建/迁移逻辑） -->
<script>
// ?reset=true → 清空当前站点数据
if (location.search.includes('reset=true')) {
  localStorage.removeItem(SiteManager.dataKey());
  try { indexedDB.deleteDatabase(SiteManager.dbName()); } catch(e) {}
  localStorage.removeItem(SiteManager.optsKey());
  localStorage.removeItem(SiteManager.PREFIX + (SiteManager.getActive() || 'default') + '_tutorial_done');
  localStorage.removeItem(SiteManager.PREFIX + (SiteManager.getActive() || 'default') + '_last_version');
  console.log('🧹 当前站点数据已全部清零！');
  history.replaceState(null, '', location.pathname);
}
// 自动创建默认站点
window._isNewUser = false;
if (SiteManager.getAll().length === 0) {
  var _hasOldData = localStorage.getItem('starfan_data') || localStorage.getItem('starfan_tutorial_done');
  SiteManager.create('我的第一个粉丝站');
  if (_hasOldData) {
    var _oldData = localStorage.getItem('starfan_data');
    if (_oldData) { localStorage.setItem(SiteManager.dataKey(), _oldData); localStorage.removeItem('starfan_data'); }
    var _oldOpts = localStorage.getItem('starfan_template_opts');
    if (_oldOpts) { localStorage.setItem(SiteManager.optsKey(), _oldOpts); localStorage.removeItem('starfan_template_opts'); }
    var _oldTut = localStorage.getItem('starfan_tutorial_done');
    if (_oldTut) { localStorage.setItem(SiteManager.PREFIX + (SiteManager.getActive()||'default') + '_tutorial_done', _oldTut); localStorage.removeItem('starfan_tutorial_done'); }
    _isNewUser = false;
  } else {
    _isNewUser = true;
  }
} else {
  var _globalTut = localStorage.getItem('starfan_tutorial_done');
  if (_globalTut) {
    var _sites = SiteManager.getAll();
    for (var _si = 0; _si < _sites.length; _si++) {
      var _sk = SiteManager.PREFIX + _sites[_si].id + '_tutorial_done';
      if (!localStorage.getItem(_sk)) localStorage.setItem(_sk, _globalTut);
    }
    localStorage.removeItem('starfan_tutorial_done');
  }
}
// 页面关闭前自动保存
window.addEventListener('beforeunload', function() {
  if (window._reactState && typeof AppState !== 'undefined') {
    AppState.data = window._reactState.data;
    AppState.save();
  }
});
</script>

<script>
// Render 兼容层 — 提供 TemplateStore.previewStyle() 所需的接口
window.Render = {
  preview(tab) {

    if (window._reactDispatch) {
      window._reactDispatch({ type: 'SET_TAB', tab: tab || (window._reactState?.activeTab || 'celebrity') });
    }
  },
  editor(tab) { /* React 管理编辑器 */ },
  renderTemplateEditor() { /* React 管理模板编辑 */ },
  renderAIPanel() { /* React 管理 AI 面板 */ },
  applyTheme(text) {
    // 保留原版主题应用逻辑（通过 body background 显示 Canvas 背景特效）
    const map = {"蓝":"#4a90e2","淡蓝":"#a8d8ff","天蓝":"#87ceeb","粉":"#ff9ecb","淡粉":"#ffd1dc","紫":"#b388ff","黄":"#ffd700","金":"#ffd700","红":"#ff4757","绿":"#2ed573","橙":"#ffa502","灰":"#a4b0be","白":"#ffffff","黑":"#222222"};
    let c1="#a8d8ff", c2="#ffd700";
    const toRgba = (hex, a) => { const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16); return `rgba(${r},${g},${b},${a})`; };
    if(text) { const parts=text.split('+').map(s=>s.trim()); const m1=parts[0]&&Object.keys(map).find(k=>text.includes(k)); const m2=parts[1]&&Object.keys(map).find(k=>text.includes(k)); if(m1)c1=map[m1]; if(m2)c2=map[m2]; }
    document.body.style.background=`linear-gradient(135deg, ${toRgba(c1,0.65)}, ${toRgba(c2,0.65)})`;
    document.body.style.backgroundAttachment='fixed';
  }
};
// Events 兼容层 — 提供追忆弹窗等功能
window.Events = {
  closeMemoir() {
    document.getElementById('memoirOverlay')?.classList.add('hidden');
  },
  switchTab(tab) {
    if (window._reactDispatch) window._reactDispatch({ type: 'SET_TAB', tab });
  },
  toggleEditor() { /* React 管理编辑面板 */ }
};
// 全局变量
window.editingNewsId = null;
</script>

<script type="text/babel">
const { useState, useEffect, useReducer, useRef, useCallback, useMemo } = React;

// ═══════════ 全局 Context & Reducer ═══════════
const AppContext = React.createContext(null);

const initialState = {
  activeTab: 'dashboard',
  data: {
    celebrity: { siteName: '', name: '', colors: '淡蓝+金色', bio: '', avatar: '', social: { weibo: '' }, bgType: 'stars' },
    news: [], gallery: [], community: [], calendar: [], shop: []
  },
  paidItems: [],
  selectedTemplate: 'default',
  selectedEffects: [],
  modal: null,           // 'memoir' | 'lightbox' | 'bill' | 'pay' | 'style' | 'site'
  modalData: null,
  viewMode: 'grid',      // gallery: grid | list | focus
  calMonth: new Date(),
  calSelected: null,
  editingNews: null,
  newsCover: null,
  editingShop: null,
  shopImage: null,
  isPreview: false,
};

function reducer(state, action) {
  switch (action.type) {
    case 'SET_TAB': return { ...state, activeTab: action.tab };
    case 'LOAD_DATA': return { ...state, data: action.data };
    case 'UPDATE_CELEBRITY': return { ...state, data: { ...state.data, celebrity: { ...state.data.celebrity, ...action.payload } } };
    case 'SET_CELEBRITY':
      return { ...state, data: { ...state.data, celebrity: action.payload } };
    case 'ADD_NEWS':
      return { ...state, data: { ...state.data, news: [...state.data.news, action.item] } };
    case 'UPDATE_NEWS':
      return { ...state, data: { ...state.data, news: state.data.news.map(n => n.id === action.item.id ? action.item : n) } };
    case 'DELETE_NEWS':
      return { ...state, data: { ...state.data, news: state.data.news.filter(n => n.id !== action.id) } };
    case 'SET_GALLERY':
      return { ...state, data: { ...state.data, gallery: action.list } };
    case 'DELETE_GALLERY':
      return { ...state, data: { ...state.data, gallery: state.data.gallery.filter(g => g.id !== action.id) } };
    case 'UPDATE_GALLERY_CAPTION':
      return { ...state, data: { ...state.data, gallery: state.data.gallery.map(g => g.id === action.id ? { ...g, caption: action.caption } : g) } };
    case 'ADD_COMMENT':
      return { ...state, data: { ...state.data, community: [...state.data.community, action.item] } };
    case 'DELETE_COMMENT':
      return { ...state, data: { ...state.data, community: state.data.community.filter((_, i) => i !== action.idx) } };
    case 'SET_CALENDAR':
      return { ...state, data: { ...state.data, calendar: action.list } };
    case 'ADD_CALENDAR':
      return { ...state, data: { ...state.data, calendar: [...state.data.calendar, action.item] } };
    case 'DELETE_CALENDAR':
      return { ...state, data: { ...state.data, calendar: state.data.calendar.filter(e => e.id !== action.id) } };
    case 'TOGGLE_REGISTER':
      return { ...state, data: { ...state.data, calendar: state.data.calendar.map(e => e.id === action.id ? { ...e, registered: !e.registered } : e) } };
    case 'SET_SHOP':
      return { ...state, data: { ...state.data, shop: action.list } };
    case 'ADD_SHOP':
      return { ...state, data: { ...state.data, shop: [...state.data.shop, action.item] } };
    case 'DELETE_SHOP':
      return { ...state, data: { ...state.data, shop: state.data.shop.filter(s => s.id !== action.id) } };
    case 'SET_PAID':
      return { ...state, paidItems: action.list };
    case 'PAY_ITEM':
      return { ...state, paidItems: [...state.paidItems, action.id] };
    case 'SET_TEMPLATE':
      return { ...state, selectedTemplate: action.id };
    case 'TOGGLE_EFFECT':
      const eid = action.id;
      const fx = state.selectedEffects.includes(eid) ? state.selectedEffects.filter(e => e !== eid) : [...state.selectedEffects, eid];
      return { ...state, selectedEffects: fx };
    case 'SET_MODAL':
      return { ...state, modal: action.modal, modalData: action.data || null };
    case 'SET_VIEW_MODE':
      return { ...state, viewMode: action.mode };
    case 'SET_CAL_MONTH':
      return { ...state, calMonth: action.date };
    case 'SET_CAL_SELECTED':
      return { ...state, calSelected: action.date };
    case 'SET_EDITING_NEWS':
      return { ...state, editingNews: action.item, newsCover: null };
    case 'SET_SHOP_EDIT':
      return { ...state, editingShop: action.item, shopImage: null };
    case 'SET_IS_PREVIEW':
      return { ...state, isPreview: action.val };
    case 'SET_DATA':
      return { ...state, data: action.data };
    default: return state;
  }
}

// ═══════════ 工具函数 ═══════════
const moduleColors = {
  celebrity: 'accent-pink', news: 'accent-amber', gallery: 'accent-sky',
  community: 'accent-purple', calendar: 'accent-green', shop: 'accent-rose'
};
const moduleIcons = { celebrity: '🌟', news: '📖', gallery: '🖼', community: '💌', calendar: '📅', shop: '🛍' };
const moduleTitles = { celebrity: '偶像资料', news: '追忆时光', gallery: '照片画廊', community: '粉丝心语', calendar: '活动日历', shop: '周边收藏' };
const moduleDescs = { celebrity: '名字、头像、简介', news: '记录每一次心动', gallery: '珍藏影像瞬间', community: '记录每一份心情', calendar: '演唱会与见面会', shop: '我的周边小柜' };
const catLabels = { '周边': '周边', '专辑': '专辑', '服饰': '服饰', '配饰': '配饰' };

// ═══════════ 组件 ═══════════

// --- Card 容器 ---
function CardContainer({ children, className, onClick, tab }) {
  return (
    <div
      className={`bg-white rounded-card shadow-card p-6 transition-all duration-300 cursor-pointer
        hover:-translate-y-1 hover:shadow-card-hover ${className || ''}`}
      onClick={onClick}
    >
      {children}
    </div>
  );
}

// --- 空状态 ---
function EmptyState({ icon, title, desc, action, onAction }) {
  return (
    <div className="flex flex-col items-center justify-center py-16 text-center">
      <div className="w-20 h-20 rounded-full bg-primary-light flex items-center justify-center mb-4">
        <span className="text-3xl">{icon}</span>
      </div>
      <h3 className="text-lg font-semibold text-text-main mb-2">{title}</h3>
      <p className="text-sm text-text-sub mb-6 max-w-xs">{desc}</p>
      {action && (
        <button onClick={onAction} className="px-6 py-2.5 bg-primary text-white rounded-btn font-medium hover:bg-primary-hover transition-colors">
          {action}
        </button>
      )}
    </div>
  );
}

// --- 模块卡片（Dashboard 网格用） ---
function ModuleCard({ tab, data }) {
  const { dispatch } = useContext(AppContext);
  const color = moduleColors[tab];

  const getPreview = () => {
    switch (tab) {
      case 'celebrity':
        if (data.celebrity.name) return <span className="text-sm font-semibold text-text-main">{data.celebrity.name}</span>;
        return <span className="text-sm text-text-sub italic">点击编辑偶像信息 ✨</span>;
      case 'news':
        return data.news.length
          ? <span className="inline-block text-xs font-semibold text-primary bg-primary-light px-3 py-1 rounded-full">{data.news.length} 条追忆</span>
          : <span className="text-sm text-text-sub italic">还没有追忆记录 📝</span>;
      case 'gallery':
        return data.gallery.length
          ? <div className="flex gap-1.5 mt-1">{data.gallery.slice(0,4).map((g,i) => <img key={i} src={g.url} className="w-10 h-10 rounded-lg object-cover border-2 border-white shadow-sm" />)}<span className="text-xs text-text-sub self-center ml-1">+{data.gallery.length}</span></div>
          : <span className="text-sm text-text-sub italic">还没有照片 🖼</span>;
      case 'community':
        return data.community.length
          ? <span className="inline-block text-xs font-semibold text-primary bg-primary-light px-3 py-1 rounded-full">{data.community.length} 条心语</span>
          : <span className="text-sm text-text-sub italic">还没有心语 💬</span>;
      case 'calendar':
        const up = data.calendar.filter(e => e.date >= new Date().toISOString().slice(0,10)).length;
        return data.calendar.length
          ? <span className="text-xs text-text-sub">{data.calendar.length} 个活动{up ? `（${up} 场待举办）` : ''}</span>
          : <span className="text-sm text-text-sub italic">还没有活动安排 📅</span>;
      case 'shop':
        return data.shop.length
          ? <span className="inline-block text-xs font-semibold text-primary bg-primary-light px-3 py-1 rounded-full">{data.shop.length} 件收藏</span>
          : <span className="text-sm text-text-sub italic">还没有周边收藏 🛍</span>;
    }
  };

  return (
    <CardContainer onClick={() => dispatch({ type: 'SET_TAB', tab })} className="group">
      <div className="flex items-center gap-3 mb-3">
        <span className="text-2xl">{moduleIcons[tab]}</span>
        <div>
          <div className="font-semibold text-base text-text-main">{moduleTitles[tab]}</div>
          <div className="text-xs text-text-sub">{moduleDescs[tab]}</div>
        </div>
      </div>
      <div className="min-h-[32px]">{getPreview()}</div>
    </CardContainer>
  );
}

// --- Sidebar ---
function Sidebar() {
  const { state, dispatch } = useContext(AppContext);
  const tabs = ['dashboard', 'celebrity', 'news', 'gallery', 'community', 'calendar', 'shop'];

  return (
    <aside className="w-[220px] min-w-[220px] h-screen sticky top-0 bg-white border-r border-border-light shadow-sidebar flex flex-col z-10">
      {/* Logo */}
      <div className="p-6 pb-4">
        <h1 className="text-xl font-bold text-primary tracking-tight">{state.data.celebrity.siteName || 'StarFan Studio'}</h1>
        <p className="text-xs text-text-sub mt-1">爱豆回忆录生成器</p>
      </div>

      {/* 导航 */}
      <nav className="flex-1 px-3 space-y-0.5 overflow-y-auto">
        {tabs.map(tab => (
          <button
            id={'nav-' + tab}
            key={tab}
            onClick={() => dispatch({ type: 'SET_TAB', tab })}
            className={`w-full flex items-center gap-3 px-4 py-2.5 rounded-btn text-sm font-medium transition-all duration-200
              ${state.activeTab === tab
                ? 'bg-primary-light text-primary font-semibold'
                : 'text-text-sub hover:bg-gray-50 hover:text-text-main'}`}
          >
            <span className="text-lg">{tab === 'dashboard' ? '🏠' : moduleIcons[tab]}</span>
            <span>{tab === 'dashboard' ? '仪表盘' : moduleTitles[tab]}</span>
          </button>
        ))}
      </nav>

      {/* 操作按钮 */}
      <div id="sidebar-actions" className="p-3 border-t border-border-light space-y-2">
        <button onClick={() => SiteUI?.toggle()} className="w-full px-4 py-2 text-sm text-text-sub bg-gray-50 hover:bg-gray-100 rounded-btn transition-colors text-left">
          🔄 切换粉丝站
        </button>
        <button onClick={() => TemplateStore?.previewStyle()} className="w-full px-4 py-2 text-sm text-text-sub bg-gray-50 hover:bg-gray-100 rounded-btn transition-colors text-left">

// --- NewsView ---
function NewsView() {
  const { state, dispatch } = useContext(AppContext);
  const [showEditor, setShowEditor] = useState(false);
  const [form, setForm] = useState({ title: '', date: new Date().toISOString().slice(0,10), content: '' });
  const [coverDataUrl, setCoverDataUrl] = useState(null);
  const [extraImages, setExtraImages] = useState([]);
  const [aiLoading, setAiLoading] = useState(false);
  const [detailItem, setDetailItem] = useState(null);

  const handleSave = async () => {
    if (!form.title && !form.content) return alert('请填写标题或内容');
    const id = 'n' + Date.now().toString(36);
    const item = { id, title: form.title, date: form.date, content: form.content, cover: '', images: [] };
    // 封面图存 IndexedDB
    if (coverDataUrl) {
      await AssetDB.save('news_' + id, coverDataUrl);
      item.cover = coverDataUrl;
    }
    // 额外图片
    if (extraImages.length) {
      for (let i = 0; i < extraImages.length; i++) {
        const niId = 'ni_' + Date.now().toString(36) + i;
        await AssetDB.save(niId, extraImages[i]);
        item.images.push(niId);
      }
    }
    dispatch({ type: 'ADD_NEWS', item });
    setShowEditor(false); setForm({ title: '', date: new Date().toISOString().slice(0,10), content: '' }); setCoverDataUrl(null); setExtraImages([]);
  };

  const handleCoverUpload = (e) => {
    const file = e.target.files?.[0];
    if (!file || file.size > 50*1024*1024) return;
    const reader = new FileReader();
    reader.onload = ev => setCoverDataUrl(ev.target.result);
    reader.readAsDataURL(file);
  };

  const handleExtraUpload = (e) => {
    const files = Array.from(e.target.files || []).filter(f => f.size <= 50*1024*1024);
    files.forEach(f => { const r = new FileReader(); r.onload = ev => setExtraImages(prev => [...prev, ev.target.result]); r.readAsDataURL(f); });
  };

  const handleAI = async () => {
    setAiLoading(true);
    await AIService.generate(`写一篇关于偶像的追忆文章，标题是"${form.title || '珍贵回忆'}"`, (text, done) => {
      setForm(f => ({ ...f, content: text }));
      if (done) setAiLoading(false);
    });
  };

  const handleDelete = (id) => { AssetDB.delete('news_' + id); dispatch({ type: 'DELETE_NEWS', id }); };

  if (detailItem) {
    return (
      <div className="max-w-2xl mx-auto">
        <button onClick={() => setDetailItem(null)} className="mb-4 text-sm text-primary hover:underline">← 返回列表</button>
        <CardContainer>
          {detailItem.cover && <img src={detailItem.cover} className="w-full h-48 object-cover rounded-lg mb-4" />}
          <h2 className="text-xl font-bold text-text-main mb-2">{detailItem.title}</h2>
          <p className="text-xs text-text-sub mb-4">{detailItem.date}</p>
          <p className="text-text-main leading-relaxed whitespace-pre-wrap">{detailItem.content}</p>
          {detailItem.images?.length > 0 && (
            <div className="mt-4 columns-2 gap-3">
              {detailItem.images.map((niId, i) => (
                <img key={i} src={niId.startsWith('ni_') ? '' : niId} className="w-full rounded-lg mb-3 object-cover" alt=""
                  onError={async (e) => { if (niId.startsWith('ni_')) { const d = await AssetDB.load(niId); if (d) e.target.src = d; } }} />
              ))}
            </div>
          )}
          <div className="flex gap-2 mt-4 pt-4 border-t border-border-light">
            <button onClick={() => setDetailItem(null)} className="text-sm text-text-sub hover:text-text-main">关闭</button>
            <button onClick={() => { setForm(detailItem); setShowEditor(true); setDetailItem(null); }} className="text-sm text-primary">编辑</button>
            <button onClick={() => { handleDelete(detailItem.id); setDetailItem(null); }} className="text-sm text-red-400">删除</button>
          </div>
        </CardContainer>
      </div>
    );
  }

  return (
    <div>
      <ModuleHeader tab="news" showEdit onEdit={() => setShowEditor(true)} />

      {/* 新增/编辑弹窗 */}
      {showEditor && (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/40 backdrop-blur-sm" onClick={e => e.target === e.currentTarget && setShowEditor(false)}>
          <div className="bg-white rounded-card shadow-2xl w-full max-w-lg mx-4 p-6 max-h-[90vh] overflow-y-auto">
            <h3 className="text-lg font-bold text-text-main mb-4">{form.id ? '编辑追忆' : '新增追忆'}</h3>
            <div className="space-y-4">
              <div>
                <label className="block text-sm font-medium text-text-sub mb-1">标题</label>
                <input value={form.title} onChange={e => setForm({...form, title:e.target.value})} placeholder="追忆标题" className="w-full px-4 py-2.5 border border-border-light rounded-btn text-sm focus:border-primary focus:ring-1 focus:ring-primary outline-none" />
              </div>
              <div>
                <label className="block text-sm font-medium text-text-sub mb-1">日期</label>
                <input type="date" value={form.date} onChange={e => setForm({...form, date:e.target.value})} className="w-full px-4 py-2.5 border border-border-light rounded-btn text-sm focus:border-primary focus:ring-1 focus:ring-primary outline-none" />
              </div>
              <div>
                <label className="block text-sm font-medium text-text-sub mb-1">封面图片</label>
                <input type="file" accept="image/*" onChange={handleCoverUpload} className="w-full text-sm" />
                {coverDataUrl && <img src={coverDataUrl} className="mt-2 w-full h-32 object-cover rounded-lg" />}
              </div>
              <div>
                <label className="block text-sm font-medium text-text-sub mb-1">额外图片（最多9张）</label>
                <input type="file" accept="image/*" multiple onChange={handleExtraUpload} className="w-full text-sm" />
                {extraImages.length > 0 && (
                  <div className="flex gap-2 mt-2 flex-wrap">
                    {extraImages.map((img, i) => <img key={i} src={img} className="w-16 h-16 object-cover rounded-lg" />)}
                  </div>
                )}
              </div>
              <div>
                <label className="block text-sm font-medium text-text-sub mb-1">内容</label>
                <textarea value={form.content} onChange={e => setForm({...form, content:e.target.value})} rows={5} placeholder="写下你的追忆..." className="w-full px-4 py-2.5 border border-border-light rounded-btn text-sm focus:border-primary focus:ring-1 focus:ring-primary outline-none resize-none" />
                <button onClick={handleAI} disabled={aiLoading} className="mt-2 px-4 py-1.5 text-xs bg-primary-light text-primary rounded-full hover:bg-primary/20 transition-colors">
                  {aiLoading ? '🤖 生成中...' : '🤖 AI 辅助写作'}
                </button>
              </div>
            </div>
            <div className="flex gap-3 mt-6">
              <button onClick={handleSave} className="flex-1 py-2.5 bg-primary text-white rounded-btn font-medium hover:bg-primary-hover transition-colors">保存</button>
              <button onClick={() => setShowEditor(false)} className="flex-1 py-2.5 bg-gray-100 text-text-sub rounded-btn font-medium hover:bg-gray-200 transition-colors">取消</button>
            </div>
          </div>
        </div>
      )}

      {/* 追忆列表 - Masonry */}
      {state.data.news.length === 0 ? (
        <EmptyState icon="📖" title="还没有追忆记录" desc="记录下你和偶像之间最珍贵的每一个瞬间" action="写第一条追忆" onAction={() => setShowEditor(true)} />
      ) : (
        <div className="columns-1 sm:columns-2 lg:columns-3 gap-4 space-y-4">
          {[...state.data.news].reverse().map(item => (
            <CardContainer key={item.id} onClick={() => setDetailItem(item)} className="break-inside-avoid group">
              {item.cover && <img src={item.cover} className="w-full h-40 object-cover rounded-lg mb-3" />}
              <p className="text-xs text-text-sub mb-1">{item.date}</p>
              <h4 className="text-base font-semibold text-text-main mb-2">{item.title || '无标题'}</h4>
              <p className="text-sm text-text-sub line-clamp-3">{item.content?.slice(0, 100)}</p>
              <div className="flex gap-2 mt-3 pt-3 border-t border-border-light opacity-0 group-hover:opacity-100 transition-opacity">
                <button onClick={e => { e.stopPropagation(); setDetailItem(item); }} className="text-xs text-primary hover:underline">查看</button>

function GalleryView() {
  const { state, dispatch } = useContext(AppContext);
  const [lightboxIdx, setLightboxIdx] = useState(null);
  const [batchMode, setBatchMode] = useState(false);
  const [selected, setSelected] = useState(new Set());

  const handleUpload = (e) => {
    const files = Array.from(e.target.files || []).filter(f => f.size <= 50*1024*1024);
    const newList = [...state.data.gallery];
    files.forEach(f => {
      const reader = new FileReader();
      reader.onload = async (ev) => {
        const id = 'g' + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
        await AssetDB.save('gallery_' + id, ev.target.result);
        newList.push({ id, caption: '', url: ev.target.result });
        dispatch({ type: 'SET_GALLERY', list: [...newList] });
      };
      reader.readAsDataURL(f);
    });
  };

  const handleDelete = (id) => { AssetDB.delete('gallery_' + id); dispatch({ type: 'DELETE_GALLERY', id }); };
  const handleBatchDelete = () => { selected.forEach(id => handleDelete(id)); setSelected(new Set()); setBatchMode(false); };

  const toggleSelect = (id) => {
    const next = new Set(selected);
    next.has(id) ? next.delete(id) : next.add(id);
    setSelected(next);
  };

  const items = state.data.gallery;

  return (
    <div>
      <ModuleHeader tab="gallery" showEdit onEdit={() => document.getElementById('galleryUploadInput')?.click()} />
      <input id="galleryUploadInput" type="file" accept="image/*" multiple onChange={handleUpload} className="hidden" />

      {/* 视图切换 + 批管理 */}
      <div className="flex items-center justify-between mb-4">
        <div className="flex gap-1 bg-gray-100 rounded-btn p-1">
          {['grid', 'list', 'focus'].map(mode => (
            <button key={mode} onClick={() => dispatch({ type: 'SET_VIEW_MODE', mode })}
              className={`px-4 py-1.5 rounded-btn text-xs font-medium transition-colors ${state.viewMode === mode ? 'bg-white shadow-sm text-text-main' : 'text-text-sub hover:text-text-main'}`}>
              {mode === 'grid' ? '▦ 网格' : mode === 'list' ? '☰ 列表' : '◉ 聚焦'}
            </button>
          ))}
        </div>
        <div className="flex gap-2">
          {items.length > 0 && (
            <button onClick={() => { setBatchMode(!batchMode); setSelected(new Set()); }}
              className={`px-3 py-1.5 text-xs rounded-btn font-medium transition-colors ${batchMode ? 'bg-red-50 text-red-500' : 'bg-gray-100 text-text-sub hover:bg-gray-200'}`}>
              {batchMode ? '取消' : '批量管理'}
            </button>
          )}
        </div>
      </div>

      {batchMode && selected.size > 0 && (
        <div className="flex items-center gap-3 mb-4 px-4 py-2 bg-red-50 rounded-btn text-sm">
          <span className="text-red-500">已选 {selected.size} 张</span>
          <button onClick={handleBatchDelete} className="text-red-500 font-semibold hover:underline">删除选中</button>
        </div>
      )}

      {items.length === 0 ? (
        <EmptyState icon="🖼" title="还没有照片" desc="上传偶像的精彩瞬间到画廊" action="上传照片" onAction={() => document.getElementById('galleryUploadInput')?.click()} />
      ) : state.viewMode === 'list' ? (
        /* 列表视图 */
        <div className="space-y-3">
          {items.map(item => (
            <div key={item.id} className="flex items-center gap-4 bg-white rounded-card shadow-card p-4 group">
              {batchMode && <input type="checkbox" checked={selected.has(item.id)} onChange={() => toggleSelect(item.id)} className="w-4 h-4" />}
              <img src={item.url} className="w-16 h-16 object-cover rounded-lg cursor-pointer" onClick={() => setLightboxIdx(items.indexOf(item))} />
              <div className="flex-1 min-w-0">
                <p className="text-sm text-text-main truncate">{item.caption || '未命名'}</p>
              </div>
              <div className="flex gap-2 opacity-0 group-hover:opacity-100 transition-opacity">
                <button onClick={() => setLightboxIdx(items.indexOf(item))} className="text-xs text-primary">查看</button>
                <button onClick={() => handleDelete(item.id)} className="text-xs text-red-400">删除</button>
              </div>
            </div>
          ))}
        </div>
      ) : state.viewMode === 'focus' ? (
        /* 聚焦视图 */
        <div className="max-w-2xl mx-auto space-y-6">
          {items.map((item, i) => (
            <CardContainer key={item.id} className="text-center">
              <img src={item.url} className="w-full max-h-[500px] object-contain rounded-lg mb-4 cursor-pointer" onClick={() => setLightboxIdx(i)} />
              <p className="text-sm text-text-sub">{item.caption || '未命名'}</p>
            </CardContainer>
          ))}
        </div>
      ) : (
        /* 网格视图 - CSS Columns 瀑布流 */
        <div className="columns-2 sm:columns-3 lg:columns-4 gap-3 space-y-3">
          {items.map((item, i) => (
            <div key={item.id} className="break-inside-avoid relative group cursor-pointer" onClick={() => batchMode ? toggleSelect(item.id) : setLightboxIdx(i)}>
              <img src={item.url} className="w-full rounded-lg object-cover" loading="lazy" />
              {batchMode && (
                <div className={`absolute top-2 right-2 w-6 h-6 rounded-full border-2 flex items-center justify-center ${selected.has(item.id) ? 'bg-primary border-primary text-white' : 'bg-white/80 border-white'}`}>
                  {selected.has(item.id) && '✓'}
                </div>
              )}
              <div className="absolute inset-0 bg-black/0 group-hover:bg-black/20 rounded-lg transition-all flex items-end p-3 opacity-0 group-hover:opacity-100">
                <p className="text-white text-xs truncate">{item.caption || '未命名'}</p>
              </div>
            </div>
          ))}
        </div>
      )}

      {/* Lightbox */}
      {lightboxIdx !== null && (
        <div className="fixed inset-0 z-50 bg-black/90 flex items-center justify-center" onClick={() => setLightboxIdx(null)}>
          <button onClick={() => setLightboxIdx(null)} className="absolute top-4 right-4 text-white text-2xl hover:opacity-70 z-10">✕</button>
          <button onClick={e => { e.stopPropagation(); setLightboxIdx(lightboxIdx > 0 ? lightboxIdx - 1 : items.length - 1); }}
            className="absolute left-4 text-white text-3xl hover:opacity-70 z-10">‹</button>
          <img src={items[lightboxIdx]?.url} className="max-w-[90vw] max-h-[85vh] object-contain" onClick={e => e.stopPropagation()} />
          <button onClick={e => { e.stopPropagation(); setLightboxIdx(lightboxIdx < items.length - 1 ? lightboxIdx + 1 : 0); }}
            className="absolute right-4 text-white text-3xl hover:opacity-70 z-10">›</button>
          <div className="absolute bottom-6 text-white text-sm">{lightboxIdx + 1} / {items.length}</div>
        </div>
      )}
    </div>
  );
}

// --- CommunityView ---
function CommunityView() {
  const { state, dispatch } = useContext(AppContext);
  const [text, setText] = useState('');

  const handleSend = () => {
    if (!text.trim()) return;
    const now = new Date();
    const time = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
    dispatch({ type: 'ADD_COMMENT', item: { text: text.trim(), time } });
    setText('');
  };

  const handleDelete = (idx) => dispatch({ type: 'DELETE_COMMENT', idx });

  const items = state.data.community;

  return (
    <div>
      <ModuleHeader tab="community" />

      {/* 发布栏 */}
      <div className="bg-white rounded-card shadow-card p-4 mb-6">
        <div className="flex gap-3">
          <textarea
            value={text} onChange={e => setText(e.target.value)}
            onKeyDown={e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSend(); } }}
            placeholder="写下你想对偶像说的话..."
            rows={2}
            className="flex-1 px-4 py-2.5 border border-border-light rounded-btn text-sm focus:border-primary focus:ring-1 focus:ring-primary outline-none resize-none"
          />
          <button onClick={handleSend} disabled={!text.trim()}
            className="self-end px-6 py-2.5 bg-primary text-white rounded-btn font-medium hover:bg-primary-hover transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
            发送 💌
          </button>
        </div>
      </div>

      {items.length === 0 ? (
        <EmptyState icon="💌" title="还没有心语" desc="写下你对偶像的爱意，记录每一份心动" />
      ) : (
        <div className="max-w-2xl space-y-4">
          {[...items].reverse().map((item, i) => {
            const text = typeof item === 'object' ? item.text : item;
            const time = typeof item === 'object' ? item.time : '';
            const origIdx = items.length - 1 - i;
            return (
              <div key={i} className="flex gap-3 group">
                <div className="w-10 h-10 rounded-full bg-primary-light flex items-center justify-center text-lg flex-shrink-0">💜</div>
                <div className="flex-1">
                  <div className="bg-white rounded-2xl rounded-tl-sm shadow-card p-4">
                    <p className="text-sm text-text-main leading-relaxed">{text}</p>
                  </div>
                  <div className="flex items-center gap-3 mt-1.5">
                    <span className="text-xs text-text-sub">{time}</span>
                    <button onClick={() => handleDelete(origIdx)}
                      className="text-xs text-red-300 opacity-0 group-hover:opacity-100 transition-opacity hover:text-red-500">删除</button>
                  </div>
                </div>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

// --- CalendarView ---
function CalendarView() {
  const { state, dispatch } = useContext(AppContext);
  const [showEditor, setShowEditor] = useState(false);
  const [form, setForm] = useState({ name: '', date: new Date().toISOString().slice(0,10), venue: '', desc: '', type: 'concert' });
  const [viewMode, setViewMode] = useState('calendar'); // calendar | timeline

  const handleSave = () => {
    if (!form.name) return;
    const id = 'ev' + Date.now().toString(36);
    dispatch({ type: 'ADD_CALENDAR', item: { id, ...form, registered: false } });
    setShowEditor(false); setForm({ name: '', date: new Date().toISOString().slice(0,10), venue: '', desc: '', type: 'concert' });
  };

  const handleDelete = (id) => dispatch({ type: 'DELETE_CALENDAR', id });
  const handleToggleRegister = (id) => dispatch({ type: 'TOGGLE_REGISTER', id });

  const typeLabels = { concert: '🎵 演唱会', 'fan-meet': '🤝 见面会', release: '💿 发布', other: '📌 其他' };

  const events = state.data.calendar;
  const calDate = state.calMonth;
  const year = calDate.getFullYear();
  const month = calDate.getMonth();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const firstDay = new Date(year, month, 0).getDay();

  const selectedDateEvents = state.calSelected
    ? events.filter(e => e.date === state.calSelected)
    : [];

  const timelineEvents = [...events].sort((a, b) => a.date.localeCompare(b.date));

  // 迷你日历
  const MiniCalendar = () => {
    const days = [];
    for (let i = 0; i < firstDay; i++) days.push(null);
    for (let d = 1; d <= daysInMonth; d++) {
      const ds = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const hasEvent = events.some(e => e.date === ds);
      const isSelected = state.calSelected === ds;
      const isToday = ds === new Date().toISOString().slice(0,10);
      days.push({ day: d, ds, hasEvent, isSelected, isToday });
    }

    return (
      <div className="bg-white rounded-card shadow-card p-5">
        <div className="flex items-center justify-between mb-4">
          <button onClick={() => dispatch({ type: 'SET_CAL_MONTH', date: new Date(year, month - 1) })} className="text-text-sub hover:text-text-main text-lg">‹</button>
          <h3 className="text-base font-semibold text-text-main">{year}年{month + 1}月</h3>
          <button onClick={() => dispatch({ type: 'SET_CAL_MONTH', date: new Date(year, month + 1) })} className="text-text-sub hover:text-text-main text-lg">›</button>
        </div>
        <div className="grid grid-cols-7 gap-1 text-center text-xs text-text-sub mb-2">
          {['日','一','二','三','四','五','六'].map(d => <div key={d}>{d}</div>)}
        </div>
        <div className="grid grid-cols-7 gap-1">
          {days.map((d, i) => (
            <div key={i} onClick={() => d && dispatch({ type: 'SET_CAL_SELECTED', date: d.ds })}
              className={`aspect-square flex items-center justify-center text-sm rounded-lg cursor-pointer transition-all
                ${!d ? '' : d.isSelected ? 'bg-primary text-white font-semibold' : d.isToday ? 'bg-primary-light text-primary font-semibold' : 'hover:bg-gray-100 text-text-main'}
                ${d?.hasEvent ? 'font-semibold' : ''}`}>
              {d?.day || ''}
              {d?.hasEvent && !d.isSelected && <span className="absolute bottom-1 w-1 h-1 rounded-full bg-primary"></span>}
            </div>
          ))}
        </div>
      </div>
    );
  };

  return (
    <div>
      <ModuleHeader tab="calendar" showEdit onEdit={() => setShowEditor(true)} />

      {/* 新增弹窗 */}
      {showEditor && (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/40 backdrop-blur-sm" onClick={e => e.target === e.currentTarget && setShowEditor(false)}>
          <div className="bg-white rounded-card shadow-2xl w-full max-w-md mx-4 p-6">
            <h3 className="text-lg font-bold text-text-main mb-4">新增活动</h3>
            <div className="space-y-3">
              <input value={form.name} onChange={e => setForm({...form, name:e.target.value})} placeholder="活动名称" className="w-full px-4 py-2.5 border border-border-light rounded-btn text-sm focus:border-primary outline-none" />
              <input type="date" value={form.date} onChange={e => setForm({...form, date:e.target.value})} className="w-full px-4 py-2.5 border border-border-light rounded-btn text-sm focus:border-primary outline-none" />
              <input value={form.venue} onChange={e => setForm({...form, venue:e.target.value})} placeholder="地点" className="w-full px-4 py-2.5 border border-border-light rounded-btn text-sm focus:border-primary outline-none" />
              <textarea value={form.desc} onChange={e => setForm({...form, desc:e.target.value})} rows={2} placeholder="描述" className="w-full px-4 py-2.5 border border-border-light rounded-btn text-sm focus:border-primary outline-none resize-none" />
              <select value={form.type} onChange={e => setForm({...form, type:e.target.value})} className="w-full px-4 py-2.5 border border-border-light rounded-btn text-sm focus:border-primary outline-none bg-white">
                {Object.entries(typeLabels).map(([k,v]) => <option key={k} value={k}>{v}</option>)}
              </select>
            </div>
            <div className="flex gap-3 mt-6">
              <button onClick={handleSave} className="flex-1 py-2.5 bg-primary text-white rounded-btn font-medium hover:bg-primary-hover">保存</button>
              <button onClick={() => setShowEditor(false)} className="flex-1 py-2.5 bg-gray-100 text-text-sub rounded-btn font-medium hover:bg-gray-200">取消</button>
            </div>
          </div>
        </div>
      )}

      {events.length === 0 ? (
        <EmptyState icon="📅" title="还没有活动安排" desc="记录偶像的演唱会、见面会等重要日程" action="添加活动" onAction={() => setShowEditor(true)} />
      ) : (
        <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
          {/* 迷你日历 */}
          <div className="lg:col-span-1"><MiniCalendar /></div>

          {/* 视图切换 + 事件列表 */}
          <div className="lg:col-span-2">
            <div className="flex gap-1 mb-4">
              {['calendar', 'timeline'].map(m => (
                <button key={m} onClick={() => { setViewMode(m); if (m === 'calendar') dispatch({ type: 'SET_CAL_SELECTED', date: null }); }}
                  className={`px-4 py-1.5 rounded-btn text-xs font-medium transition-colors ${viewMode === m ? 'bg-primary text-white' : 'bg-gray-100 text-text-sub hover:bg-gray-200'}`}>
                  {m === 'calendar' ? '📅 按日期' : '📋 时间轴'}
                </button>
              ))}
            </div>

            {viewMode === 'calendar' && state.calSelected && (
              <div className="mb-4">
                <h4 className="text-sm font-semibold text-text-main mb-2">{state.calSelected} 的活动</h4>
                {selectedDateEvents.length === 0 ? (
                  <p className="text-sm text-text-sub">当天没有活动</p>
                ) : (
                  <div className="space-y-2">
                    {selectedDateEvents.map(e => (
                      <div key={e.id} className="bg-white rounded-card shadow-card p-4 group">
                        <div className="flex items-center justify-between">
                          <div>
                            <h5 className="font-semibold text-text-main">{e.name}</h5>
                            <p className="text-xs text-text-sub mt-1">{e.venue}{e.desc ? ' · ' + e.desc : ''}</p>
                          </div>
                          <div className="flex items-center gap-2">
                            <button onClick={() => handleToggleRegister(e.id)}
                              className={`text-xs px-3 py-1 rounded-full font-medium ${e.registered ? 'bg-green-100 text-green-600' : 'bg-gray-100 text-text-sub'}`}>
                              {e.registered ? '✓ 已报名' : '报名'}
                            </button>
                            <button onClick={() => handleDelete(e.id)} className="text-xs text-red-300 opacity-0 group-hover:opacity-100 hover:text-red-500">删除</button>
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}

            {viewMode === 'timeline' && (
              <div className="relative pl-8 border-l-2 border-primary-light space-y-6">
                {timelineEvents.map((e, i) => (
                  <div key={e.id} className="relative group">
                    <div className="absolute -left-[25px] w-3 h-3 rounded-full bg-primary border-2 border-white" />
                    <CardContainer onClick={null}>
                      <div className="flex items-center justify-between mb-2">
                        <span className="text-xs text-text-sub">{e.date}</span>
                        <span className="text-xs px-2 py-0.5 bg-primary-light text-primary rounded-full">{typeLabels[e.type] || e.type}</span>
                      </div>
                      <h5 className="font-semibold text-text-main">{e.name}</h5>
                      <p className="text-xs text-text-sub mt-1">{e.venue}{e.desc ? ' · ' + e.desc : ''}</p>
                      <div className="flex items-center gap-2 mt-3 pt-3 border-t border-border-light">
                        <button onClick={() => handleToggleRegister(e.id)}
                          className={`text-xs px-3 py-1 rounded-full font-medium ${e.registered ? 'bg-green-100 text-green-600' : 'bg-gray-100 text-text-sub hover:bg-gray-200'}`}>
                          {e.registered ? '✓ 已报名' : '📝 报名'}
                        </button>
                        <button onClick={() => handleDelete(e.id)} className="text-xs text-red-300 opacity-0 group-hover:opacity-100 hover:text-red-500">删除</button>
                      </div>
                    </CardContainer>
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

// --- ShopView ---
function ShopView() {
  const { state, dispatch } = useContext(AppContext);
  const [showEditor, setShowEditor] = useState(false);
  const [form, setForm] = useState({ name: '', emoji: '', cat: '周边', desc: '' });
  const [imageDataUrl, setImageDataUrl] = useState(null);
  const [filterCat, setFilterCat] = useState('全部');

  const handleSave = async () => {
    if (!form.name) return;
    const id = 'sp' + Date.now().toString(36);
    const item = { id, ...form, image: '' };
    if (imageDataUrl) { await AssetDB.save('shop_' + id, imageDataUrl); item.image = imageDataUrl; }
    dispatch({ type: 'ADD_SHOP', item });
    setShowEditor(false); setForm({ name: '', emoji: '', cat: '周边', desc: '' }); setImageDataUrl(null);
  };

  const handleImageUpload = (e) => {
    const file = e.target.files?.[0];
    if (!file || file.size > 50*1024*1024) return;
    const reader = new FileReader();
    reader.onload = ev => setImageDataUrl(ev.target.result);
    reader.readAsDataURL(file);
  };

  const handleDelete = (id) => { AssetDB.delete('shop_' + id); dispatch({ type: 'DELETE_SHOP', id }); };

  const cats = ['全部', '周边', '专辑', '服饰', '配饰'];
  const filtered = filterCat === '全部' ? state.data.shop : state.data.shop.filter(s => s.cat === filterCat);

  return (
    <div>
      <ModuleHeader tab="shop" showEdit onEdit={() => setShowEditor(true)} />

      {showEditor && (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/40 backdrop-blur-sm" onClick={e => e.target === e.currentTarget && setShowEditor(false)}>
          <div className="bg-white rounded-card shadow-2xl w-full max-w-md mx-4 p-6">
            <h3 className="text-lg font-bold text-text-main mb-4">添加收藏</h3>
            <div className="space-y-3">
              <input value={form.name} onChange={e => setForm({...form, name:e.target.value})} placeholder="收藏名称" className="w-full px-4 py-2.5 border border-border-light rounded-btn text-sm focus:border-primary outline-none" />
              <input value={form.emoji} onChange={e => setForm({...form, emoji:e.target.value})} placeholder="emoji 图标（如 💿）" className="w-full px-4 py-2.5 border border-border-light rounded-btn text-sm focus:border-primary outline-none" />
              <select value={form.cat} onChange={e => setForm({...form, cat:e.target.value})} className="w-full px-4 py-2.5 border border-border-light rounded-btn text-sm focus:border-primary outline-none bg-white">
                {['周边','专辑','服饰','配饰'].map(c => <option key={c} value={c}>{c}</option>)}
              </select>
              <textarea value={form.desc} onChange={e => setForm({...form, desc:e.target.value})} rows={2} placeholder="心得备注" className="w-full px-4 py-2.5 border border-border-light rounded-btn text-sm focus:border-primary outline-none resize-none" />
              <input type="file" accept="image/*" onChange={handleImageUpload} className="w-full text-sm" />
              {imageDataUrl && <img src={imageDataUrl} className="w-full h-32 object-cover rounded-lg" />}
            </div>
            <div className="flex gap-3 mt-6">
              <button onClick={handleSave} className="flex-1 py-2.5 bg-primary text-white rounded-btn font-medium hover:bg-primary-hover">保存</button>
              <button onClick={() => setShowEditor(false)} className="flex-1 py-2.5 bg-gray-100 text-text-sub rounded-btn font-medium hover:bg-gray-200">取消</button>
            </div>
          </div>
        </div>
      )}

      {/* 分类筛选 */}
      {state.data.shop.length > 0 && (
        <div className="flex gap-2 mb-4 flex-wrap">
          {cats.map(c => (
            <button key={c} onClick={() => setFilterCat(c)}
              className={`px-4 py-1.5 rounded-full text-xs font-medium transition-colors ${filterCat === c ? 'bg-primary text-white' : 'bg-gray-100 text-text-sub hover:bg-gray-200'}`}>
              {c}
            </button>
          ))}
        </div>
      )}

      {state.data.shop.length === 0 ? (
        <EmptyState icon="🛍" title="还没有周边收藏" desc="记录你收藏的偶像周边，打造专属小柜" action="添加收藏" onAction={() => setShowEditor(true)} />
      ) : (
        <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4">
          {filtered.map(item => (
            <CardContainer key={item.id} onClick={null} className="group text-center">
              <div className="w-full h-36 bg-gray-50 rounded-lg mb-3 flex items-center justify-center overflow-hidden">
                {item.image ? (
                  <img src={item.image} className="w-full h-full object-cover" />
                ) : (
                  <span className="text-4xl">{item.emoji || '📦'}</span>
                )}
              </div>
              <h5 className="font-semibold text-sm text-text-main">{item.name}</h5>
              <p className="text-xs text-text-sub mt-1">{item.desc?.slice(0, 20)}</p>
              <span className="text-[10px] px-2 py-0.5 bg-primary-light text-primary rounded-full mt-2 inline-block">{item.cat}</span>
              <button onClick={() => handleDelete(item.id)} className="block mx-auto mt-2 text-xs text-red-300 opacity-0 group-hover:opacity-100 hover:text-red-500">删除</button>
            </CardContainer>
          ))}
        </div>
      )}
    </div>
  );
}

          <img
            src={state.data.celebrity.avatar || 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect fill="%23E8DEF8" width="100" height="100" rx="50"/><text x="50" y="55" text-anchor="middle" fill="%237C5CFC" font-size="40">★</text></svg>'}
            className="w-20 h-20 rounded-full border-4 border-white shadow-md object-cover"
          />
          <div>
            <h2 className="text-xl font-bold text-text-main">{state.data.celebrity.name || '未设置偶像'}</h2>
            <p className="text-sm text-text-sub">{state.data.celebrity.bio?.slice(0, 50) || '点击进入编辑偶像信息'}</p>
          </div>
        </div>
        <div className="px-6 pb-4 flex gap-4">
          {[
            { label: '追忆', val: state.data.news.length },
            { label: '照片', val: state.data.gallery.length },
            { label: '心语', val: state.data.community.length },
            { label: '活动', val: state.data.calendar.length },
            { label: '收藏', val: state.data.shop.length },
          ].map(s => (
            <div key={s.label} className="text-center">
              <div className="text-lg font-bold text-primary">{s.val}</div>
              <div className="text-[10px] text-text-sub">{s.label}</div>
            </div>
          ))}
        </div>
      </CardContainer>

      {/* Module Grid */}
      <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
        {tabs.map(tab => <ModuleCard key={tab} tab={tab} data={state.data} />)}
      </div>
    </div>
  );
}

// ═══════════ App 主组件 ═══════════
function App() {
  const [state, dispatch] = useReducer(reducer, initialState);
  const [loaded, setLoaded] = useState(false);
  const [initError, setInitError] = useState(null);

  // 初始化：加载数据
  useEffect(() => {
    (async () => {
      try {
        await AppState.init();
        dispatch({ type: 'LOAD_DATA', data: AppState.data });

        // 恢复模板/特效/付费状态
        const opts = JSON.parse(localStorage.getItem(SiteManager.optsKey()) || '{}');
        if (opts.template) dispatch({ type: 'SET_TEMPLATE', id: opts.template });
        if (opts.effects) opts.effects.forEach(e => dispatch({ type: 'TOGGLE_EFFECT', id: e }));
        if (opts.paid) dispatch({ type: 'SET_PAID', list: opts.paid });

        // 背景特效
        if (typeof BackgroundFX !== 'undefined') {
          BackgroundFX.init();
          BackgroundFX.setType(AppState.data.celebrity.bgType || 'stars');
        }

        // 模板初始化
        if (typeof TemplateStore !== 'undefined') TemplateStore.init();

        // 更新通知
        if (typeof UpdateNotifier !== 'undefined') UpdateNotifier.init();

        // 教程
        if (window._isNewUser) {
          setTimeout(function() {
            try { if (typeof Tutorial !== 'undefined') Tutorial.init(); }
            catch(e) { console.warn('教程初始化失败:', e); }
          }, 500);
        }

        setLoaded(true);
      } catch (err) {
        console.error('初始化失败:', err);
        setInitError(err && err.message ? err.message : '应用初始化失败，请刷新重试');
      }
    })();
  }, []);

  // 数据变更时自动保存
  useEffect(() => {
    if (!loaded) return;
    AppState.data = state.data;
    AppState.currentTab = state.activeTab;
    AppState.save();

    // 保存模板选项
    const opts = {
      template: state.selectedTemplate,
      effects: state.selectedEffects,
      paid: state.paidItems
    };
    localStorage.setItem(SiteManager.optsKey(), JSON.stringify(opts));
    TemplateStore.selectedTemplate = state.selectedTemplate;
    TemplateStore.selectedEffects = state.selectedEffects;
    TemplateStore.paidItems = state.paidItems;
    TemplateStore.save();
  }, [state.data, state.selectedTemplate, state.selectedEffects, state.paidItems, loaded]);

  // 导出全局状态给外部模块
  useEffect(() => { window._reactState = state; window._reactDispatch = dispatch; }, [state]);

  if (!loaded) {
    return (
      <div className="flex items-center justify-center min-h-screen">
        <div className="text-center">
          <div className="text-4xl mb-4 animate-bounce">🌟</div>
          <p className="text-text-sub">StarFan Studio 加载中...</p>
          {initError && (
            <div className="mt-4 p-4 bg-red-50 rounded-card max-w-sm mx-auto">
              <p className="text-sm text-red-500 font-medium">⚠️ 初始化出错</p>
              <p className="text-xs text-red-400 mt-1">{initError}</p>
              <button onClick={() => location.reload()} className="mt-3 px-4 py-2 bg-red-500 text-white rounded-btn text-xs font-medium hover:bg-red-600">
                刷新重试
              </button>
            </div>
          )}
        </div>
      </div>
    );
  }

  const showRightPanel = state.activeTab === 'dashboard';

  const renderContent = () => {
    switch (state.activeTab) {
      case 'dashboard': return <Dashboard />;
      case 'celebrity': return <CelebrityView />;
      case 'news': return <NewsView />;
      case 'gallery': return <GalleryView />;
      case 'community': return <CommunityView />;
      case 'calendar': return <CalendarView />;
      case 'shop': return <ShopView />;
      default: return <Dashboard />;
    }
  };

  return (
    <AppContext.Provider value={{ state, dispatch }}>
      <div className="flex min-h-screen">
        <Sidebar />
        <main className={`flex-1 p-6 md:p-8 pb-24 ${showRightPanel ? '' : 'max-w-6xl mx-auto w-full'}`}>
          {renderContent()}
        </main>
        {showRightPanel && <RightPanel />}
      </div>

      {/* 站点列表面板（复用原 SiteUI） */}
      <div id="sitePanel" className="hidden"></div>
      {/* 更新通知弹窗 */}
      <div id="updateNotice" className="hidden"></div>
      {/* 追忆详情弹窗（复用原版） */}
      <div className="memoir-overlay hidden" id="memoirOverlay" onClick={e => { if(e.target===e.currentTarget) Events?.closeMemoir?.() }}>
        <div className="memoir-modal" style={{position:'relative'}}>
          <button className="memoir-close" onClick={() => Events?.closeMemoir?.()}>✕</button>
          <div className="memoir-header"><h3 id="memoirTitle"></h3><div className="memoir-meta" id="memoirMeta"></div></div>
          <div className="memoir-body" id="memoirBody"></div>
        </div>
      </div>
      <div className="memoir-img-lightbox hidden" id="memoirLightbox" onClick={e => e.currentTarget.classList.remove('show')}>
        <img id="memoirLightboxImg" src="" />
      </div>
    </AppContext.Provider>
  );
}

// 挂载
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

<!-- ═══════════ 安全兜底：检测 React 是否成功挂载 ═══════════ -->
<script>
(function() {
  var start = Date.now();
  var check = setInterval(function() {
    var root = document.getElementById('root');
    var loading = document.getElementById('root-loading');
    // 如果 root 被 React 接管，loading div 应该已被替换掉
    if (root && !root.querySelector('#root-loading')) {
      clearInterval(check); // React 正常挂载
      return;
    }
    // 10 秒超时
    if (Date.now() - start > 10000) {
      clearInterval(check);
      var err = document.getElementById('root-error');
      if (err) {
        err.style.display = 'block';
        err.innerHTML = '页面加载超时。可能原因：<br>① CDN 资源被拦截，请检查网络<br>② 浏览器控制台 (F12 → Console) 查看详细报错<br>③ 尝试刷新或清除缓存后重试';
      }
    }
  }, 500);
})();
</script>
</body>
</html>
