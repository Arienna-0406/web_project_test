<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StarFan Studio</title>

<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- Tailwind CSS Play CDN -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        primary: '#7C5CFC',
        'primary-hover': '#6A4FE0',
        'primary-light': 'rgba(124,92,252,0.08)',
        'primary-glow': 'rgba(124,92,252,0.18)',
        bg: '#F8F7FF',
        text: '#111827',
        secondary: '#6B7280',
        ai: '#9B7EDE',
        success: '#34d399',
        danger: '#ff6b6b'
      },
      fontFamily: {
        sans: ['Inter', 'Noto Sans SC', 'system-ui', '-apple-system', 'sans-serif']
      },
      borderRadius: {
        'card': '16px'
      },
      spacing: {
        'card-pad': '24px'
      },
      transitionTimingFunction: {
        'spring': 'cubic-bezier(0.34,1.56,0.64,1)'
      },
      boxShadow: {
        'card-sm': '0 2px 8px rgba(124,92,252,0.05)',
        'card': '0 4px 20px rgba(124,92,252,0.08)',
        'card-lg': '0 12px 40px rgba(124,92,252,0.12)',
        'primary': '0 4px 16px rgba(124,92,252,0.3)'
      }
    }
  }
}
</script>

<!-- Custom CSS -->
<style>
:root {
  --primary: #7C5CFC;
  --primary-hover: #6A4FE0;
  --primary-light: rgba(124,92,252,0.08);
  --primary-glow: rgba(124,92,252,0.18);
  --ai: #9B7EDE;
  --success: #34d399;
  --danger: #ff6b6b;
  --bg-start: #F0F2F8;
  --bg-end: #E8EAF5;
  --text-main: #111827;
  --text-sub: #6B7280;
  --border: rgba(124,92,252,0.1);
  --shadow-sm: 0 2px 8px rgba(124,92,252,0.05);
  --shadow-md: 0 4px 20px rgba(124,92,252,0.08);
  --shadow-lg: 0 12px 40px rgba(124,92,252,0.12);
  --radius-sm: 10px;
  --radius-md: 16px;
  --radius-lg: 22px;
  --radius-full: 9999px;
  --transition: 0.3s cubic-bezier(0.34,1.2,0.64,1);
  --spring: 0.4s cubic-bezier(0.34,1.56,0.64,1);
}
* { box-sizing: border-box; }
body {
  margin:0; font-family:'Inter','Noto Sans SC',system-ui,-apple-system,sans-serif;
  background:var(--bg-start); min-height:100vh; color:var(--text-main);
  line-height:1.65; overflow-x:hidden;
}

/* Background Layers */
#bgImageLayer {
  position:fixed; inset:0; z-index:-3;
  background-image:url('背景图/ChatGPT Image 2026年5月28日 10_30_57.png');
  background-size:cover; background-position:center; background-repeat:no-repeat; opacity:0.06;
}
#bgCanvas { position:fixed; top:0; left:0; width:100%; height:100%; z-index:-2; pointer-events:none; }

/* Card Container Base */
.card-container {
  background:#fff; border-radius:16px; padding:24px;
  box-shadow:var(--shadow-sm); border:1px solid var(--border);
  transition:all 0.3s ease;
}
.card-container:hover {
  transform:translateY(-4px); box-shadow:var(--shadow-lg);
}

/* Hover Overlay */
.hover-overlay {
  position:absolute; inset:0; background:rgba(0,0,0,0.4);
  border-radius:16px; display:flex; align-items:center; justify-content:center;
  opacity:0; transition:opacity 0.3s ease; z-index:10;
}
.card-container:hover .hover-overlay { opacity:1; }

/* Editor Panel Slide */
.editor-panel {
  position:fixed; top:0; left:-360px; width:340px; height:100vh;
  background:rgba(255,255,255,0.92); backdrop-filter:blur(28px) saturate(160%);
  border-right:1px solid var(--border); padding:24px;
  box-shadow:4px 0 40px rgba(124,92,252,0.1); z-index:1000;
  transition:left var(--spring); overflow-y:auto; display:flex; flex-direction:column;
}
.editor-panel.open { left:0; }

/* Overlay */
.editor-overlay {
  position:fixed; inset:0; background:rgba(17,24,39,0.25);
  z-index:999; opacity:0; pointer-events:none; transition:opacity var(--transition);
}
.editor-overlay.show { opacity:1; pointer-events:auto; }

/* Form Elements */
.editor-panel input, .editor-panel textarea, .editor-panel select {
  width:100%; padding:10px 14px; margin:4px 0; border-radius:12px;
  border:1px solid rgba(124,92,252,0.15); background:rgba(124,92,252,0.04);
  color:#2D3436; font-size:13px; transition:0.2s;
}
.editor-panel input:focus, .editor-panel textarea:focus {
  outline:none; border-color:var(--primary); box-shadow:0 0 0 3px rgba(124,92,252,0.12);
  background:#fff;
}
.editor-panel button {
  width:100%; padding:12px; border:none; border-radius:12px;
  cursor:pointer; font-size:13px; font-weight:600;
  transition:var(--transition); margin-top:8px;
}
.btn-primary {
  background:linear-gradient(135deg,var(--primary),var(--ai));
  color:#fff; box-shadow:0 4px 14px rgba(124,92,252,0.25);
}
.btn-primary:hover { transform:translateY(-2px); box-shadow:0 6px 22px rgba(124,92,252,0.35); }
.btn-ai { background:linear-gradient(135deg,var(--ai),#b8a0f0); color:#fff; }
.btn-ai:hover { box-shadow:0 6px 22px rgba(155,126,222,0.35); transform:translateY(-2px); }
.btn-danger { background:linear-gradient(135deg,var(--danger),#ff9f9f); color:#fff; }
.btn-small { width:auto; padding:6px 14px; font-size:11px; margin:0; border-radius:10px; }

/* Editor Tabs */
.editor-tabs { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:16px; }
.editor-tab {
  flex:1; padding:8px 4px; background:rgba(124,92,252,0.06);
  border:1px solid rgba(124,92,252,0.1); border-radius:9999px;
  cursor:pointer; text-align:center; font-size:11px; font-weight:500;
  color:var(--text-sub); transition:var(--transition);
}
.editor-tab.active {
  background:linear-gradient(135deg,var(--primary),var(--ai));
  color:#fff; border-color:transparent;
  box-shadow:0 0 14px var(--primary-glow);
}

/* AI Panel */
.ai-panel {
  background:#fff; border:1px solid var(--border);
  border-radius:16px; padding:16px; box-shadow:var(--shadow-sm);
}
.ai-panel .content {
  background:rgba(124,92,252,0.04); padding:16px;
  border-radius:12px; min-height:60px; font-size:13px; line-height:1.7;
  white-space:pre-wrap; color:#374151;
  border:1px solid rgba(124,92,252,0.08);
}
.typing-cursor::after { content:'▋'; animation:blink 1s step-end infinite; color:var(--ai); }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

/* FAB Button */
.fab-btn {
  position:fixed; bottom:28px; right:28px; z-index:1001;
  width:60px; height:60px; border-radius:50%;
  background:linear-gradient(135deg,#A29BFE,#7B6FE5,#6A5DD4);
  color:#fff; border:none;
  box-shadow:0 4px 20px rgba(124,92,252,0.4),0 0 0 4px rgba(124,92,252,0.1);
  cursor:grab; font-size:13px; font-weight:700;
  letter-spacing:1px; display:flex; align-items:center; justify-content:center;
  transition:all 0.3s ease; touch-action:none; user-select:none;
}
.fab-btn::after {
  content:''; position:absolute; width:10px; height:10px;
  background:rgba(255,255,255,0.6); border-radius:50%;
  top:22%; left:24%;
}
.fab-btn:hover { transform:scale(1.08); box-shadow:0 6px 28px rgba(124,92,252,0.5),0 0 0 6px rgba(124,92,252,0.08); }
.fab-btn.dragging { cursor:grabbing; opacity:0.9; box-shadow:0 8px 32px rgba(124,92,252,0.6); z-index:2000; }
.editor-panel.open ~ .fab-btn { background:linear-gradient(135deg,#b2b2b2,#888); box-shadow:0 4px 16px rgba(0,0,0,0.2); }

/* Footer */
.site-footer-bar { position:fixed; bottom:0; left:0; right:0; z-index:999; text-align:center; padding:14px 24px; background:linear-gradient(to top,rgba(240,242,248,0.9),transparent); pointer-events:none; }
.site-footer-bar .copy { font-size:12px; color:rgba(107,114,128,0.5); pointer-events:auto; }

/* Section Header */
.section-title { font-size:22px; font-weight:800; color:var(--text-main); letter-spacing:-0.3px; }

/* Inline Delete Button */
.inline-del-btn {
  position:absolute; top:10px; right:10px;
  background:rgba(255,107,107,0.92); color:#fff;
  width:26px; height:26px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-size:12px; cursor:pointer; opacity:0; transition:0.2s; border:none;
  box-shadow:0 2px 8px rgba(255,107,107,0.3); z-index:20;
}
.card-container:hover .inline-del-btn { opacity:1; }

/* News Grid Masonry */
.news-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:24px; }
.news-card { border-radius:16px; overflow:hidden; background:#fff; box-shadow:var(--shadow-sm); transition:var(--transition); border:1px solid rgba(124,92,252,0.06); cursor:pointer; }
.news-card:hover { transform:translateY(-4px); box-shadow:var(--shadow-lg); }
.news-card img { width:100%; height:160px; object-fit:cover; background:#f3f4f6; }
.news-card .news-body { padding:16px; }

/* Gallery Grid Masonry */
.gallery-grid { column-count:3; column-gap:16px; }
.gallery-item-img {
  position:relative; border-radius:16px; overflow:hidden;
  break-inside:avoid; margin-bottom:16px;
  box-shadow:var(--shadow-sm); transition:var(--transition); background:#f3f4f6;
}
.gallery-item-img:hover { transform:scale(1.02); box-shadow:var(--shadow-lg); }
.gallery-item-img img { width:100%; display:block; transition:0.4s; }
.gallery-item-img:hover img { transform:scale(1.05); }
.gallery-caption {
  position:absolute; bottom:0; left:0; right:0;
  background:linear-gradient(transparent,rgba(45,52,54,0.75)); color:#fff;
  font-size:12px; padding:28px 10px 10px;
  transform:translateY(100%); transition:0.35s;
}
.gallery-item-img:hover .gallery-caption { transform:translateY(0); }

/* Chat Bubbles */
.chat-bubble {
  background:#fff; padding:16px; border-radius:16px;
  margin-bottom:12px; box-shadow:var(--shadow-sm);
  border-left:3px solid rgba(124,92,252,0.2); position:relative;
}

/* Calendar */
.calendar-wrap {
  background:#fff; border-radius:22px; overflow:hidden;
  box-shadow:var(--shadow-sm); margin-bottom:32px; border:1px solid var(--border);
}
.cal-header { display:flex; align-items:center; justify-content:space-between; padding:24px 32px; background:linear-gradient(135deg,var(--primary),var(--ai)); color:#fff; }
.cal-header h3 { margin:0; font-size:18px; font-weight:700; }
.cal-nav { background:rgba(255,255,255,0.2); border:none; color:#fff; width:32px; height:32px; border-radius:50%; cursor:pointer; font-size:16px; display:flex; align-items:center; justify-content:center; transition:0.2s; }
.cal-nav:hover { background:rgba(255,255,255,0.35); }
.cal-grid { display:grid; grid-template-columns:repeat(7,1fr); }
.cal-day-name { text-align:center; padding:10px 4px; font-size:12px; font-weight:600; color:var(--text-sub); background:rgba(124,92,252,0.03); }
.cal-cell { min-height:60px; padding:6px; border:1px solid rgba(124,92,252,0.05); cursor:pointer; transition:0.15s; position:relative; }
.cal-cell:hover { background:var(--primary-light); }
.cal-cell.other-month { opacity:0.35; }
.cal-cell.today .cal-date { background:linear-gradient(135deg,var(--primary),var(--ai)); color:#fff; border-radius:50%; width:24px; height:24px; display:flex; align-items:center; justify-content:center; font-weight:700; }
.cal-cell.selected { background:var(--primary-light); border-color:var(--primary); }
.cal-date { font-size:13px; font-weight:600; margin-bottom:4px; }
.cal-dot { width:6px; height:6px; border-radius:50%; background:var(--primary); display:inline-block; margin:1px; }

/* Event Timeline */
.event-card {
  background:#fff; border-radius:16px; padding:16px;
  box-shadow:var(--shadow-sm); display:flex; gap:16px;
  align-items:flex-start; position:relative; transition:var(--transition);
  border:1px solid var(--border); margin-bottom:12px;
}
.event-card:hover { transform:translateX(4px); box-shadow:var(--shadow-md); }
.event-date-badge { min-width:50px; text-align:center; background:linear-gradient(135deg,var(--primary),var(--ai)); color:#fff; border-radius:16px; padding:8px 4px; }
.event-badge-month { font-size:11px; opacity:0.85; }
.event-badge-day { font-size:22px; font-weight:800; line-height:1; }
.event-tag-label { display:inline-block; padding:3px 10px; border-radius:10px; font-size:11px; font-weight:600; margin-top:6px; }
.event-tag-concert { background:var(--primary-light); color:var(--primary); }
.event-tag-fanmeet { background:#fce7f3; color:#db2777; }
.event-tag-release { background:#dcfce7; color:#16a34a; }
.event-tag-other { background:#f3f4f6; color:#6b7280; }

/* Shop Grid */
.shop-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:24px; }

/* Modal Overlays */
.modal-overlay {
  position:fixed; inset:0; z-index:10000;
  background:rgba(10,5,20,0.72); backdrop-filter:blur(12px);
  display:flex; align-items:center; justify-content:center;
  opacity:0; pointer-events:none; transition:opacity 0.3s ease;
}
.modal-overlay.show { opacity:1; pointer-events:auto; }
.modal-box {
  background:#fff; border-radius:22px; width:min(420px,92vw); overflow:hidden;
  box-shadow:0 30px 90px rgba(107,33,94,0.25);
  transform:translateY(24px) scale(0.94); transition:transform var(--spring);
}
.modal-overlay.show .modal-box { transform:translateY(0) scale(1); }

/* Memoir Modal */
.memoir-overlay {
  position:fixed; inset:0; background:rgba(10,5,20,0.65); backdrop-filter:blur(8px);
  z-index:9000; display:flex; align-items:center; justify-content:center;
  opacity:0; pointer-events:none; transition:opacity 0.3s ease;
}
.memoir-overlay.show { opacity:1; pointer-events:auto; }
.memoir-modal {
  background:#fff; border-radius:22px; width:min(620px,94vw); max-height:85vh;
  overflow:hidden; box-shadow:0 30px 80px rgba(107,33,94,0.25);
  transform:translateY(20px) scale(0.95); transition:transform var(--spring);
  display:flex; flex-direction:column;
}
.memoir-overlay.show .memoir-modal { transform:translateY(0) scale(1); }

/* Memoir Lightbox */
.memoir-lightbox {
  position:fixed; inset:0; background:rgba(0,0,0,0.9); z-index:10000;
  display:flex; align-items:center; justify-content:center; cursor:pointer;
  opacity:0; pointer-events:none; transition:opacity 0.3s;
}
.memoir-lightbox.show { opacity:1; pointer-events:auto; }
.memoir-lightbox img { max-width:92vw; max-height:92vh; border-radius:12px; object-fit:contain; }

/* Site Panel Dropdown */
.site-panel-drop {
  position:fixed; top:72px; right:16px; z-index:1020;
  width:min(340px,88vw); background:#fff; border-radius:22px;
  box-shadow:0 20px 60px rgba(107,33,94,0.2),0 0 0 1px rgba(138,115,187,0.1);
  opacity:0; transform:translateY(-8px) scale(0.97); pointer-events:none;
  transition:opacity 0.25s ease,transform var(--spring); overflow:hidden;
}
.site-panel-drop.open { opacity:1; transform:translateY(0) scale(1); pointer-events:auto; }

/* Template Grid */
.tmpl-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; }
.tmpl-card {
  border-radius:16px; overflow:hidden; cursor:pointer; position:relative;
  border:2px solid transparent; transition:all var(--transition);
  box-shadow:var(--shadow-sm); background:#fff;
}
.tmpl-card:hover { transform:translateY(-3px); box-shadow:var(--shadow-md); }
.tmpl-card.selected { border-color:var(--primary); box-shadow:0 0 0 3px var(--primary-glow),var(--shadow-md); }
.tmpl-preview { height:90px; position:relative; overflow:hidden; }

/* Effect Chip */
.fx-chip {
  display:inline-flex; align-items:center; gap:6px; padding:8px 16px;
  border-radius:20px; border:1.5px solid rgba(124,92,252,0.15); background:#fff;
  cursor:pointer; font-size:12px; font-weight:600; color:#374151;
  transition:all var(--transition); margin:0 6px 6px 0;
}
.fx-chip:hover { border-color:var(--primary); background:var(--primary-light); transform:translateY(-2px); }
.fx-chip.selected { border-color:var(--primary); background:linear-gradient(135deg,var(--primary),var(--ai)); color:#fff; box-shadow:0 0 12px var(--primary-glow); }

/* Guide Items */
.site-guide-bar { display:flex; justify-content:center; gap:10px; flex-wrap:wrap; margin-bottom:28px; padding:12px 0; }
.guide-item {
  display:flex; align-items:center; gap:8px; padding:12px 20px;
  background:#fff; border-radius:16px; cursor:pointer;
  transition:var(--transition); border:1px solid var(--border); box-shadow:var(--shadow-sm);
}
.guide-item:hover { background:var(--primary-light); transform:translateY(-3px); box-shadow:var(--shadow-md); border-color:rgba(124,92,252,0.2); }

/* Fullscreen Mode */
body.fullscreen-mode .fab-btn { display:none !important; }
.exit-preview-btn { display:none; position:fixed; top:16px; left:16px; z-index:2000; background:rgba(17,24,39,0.7); color:#fff; border:none; border-radius:20px; padding:8px 16px; cursor:pointer; font-size:13px; }
body.fullscreen-mode .exit-preview-btn { display:block; }
body.fullscreen-mode .action-bar { position:fixed; top:16px; right:16px; z-index:2000; background:rgba(255,255,255,0.95); backdrop-filter:blur(14px); padding:6px 10px; border-radius:22px; box-shadow:var(--shadow-lg); border:1px solid var(--border); }

/* Tutorial */
.tut-welcome { position:fixed; inset:0; z-index:9998; display:flex; align-items:center; justify-content:center; background:rgba(10,5,20,0.7); backdrop-filter:blur(10px); opacity:0; pointer-events:none; transition:opacity 0.4s ease; overflow-y:auto; }
.tut-welcome.active { opacity:1; pointer-events:auto; }
.tut-welcome-card { background:#fff; border-radius:22px; width:min(460px,90vw); max-height:90vh; overflow-y:auto; margin:auto; box-shadow:0 30px 80px rgba(107,33,94,0.25); transform:translateY(30px) scale(0.95); transition:transform var(--spring); overflow-x:hidden; }
.tut-welcome.active .tut-welcome-card { transform:translateY(0) scale(1); }
.tut-welcome-hero { padding:36px 32px 22px; text-align:center; background:linear-gradient(135deg,var(--primary),var(--ai),#b8a0f0,#e8eaf5); position:relative; overflow:hidden; }
.tut-welcome-icon { font-size:58px; display:block; margin-bottom:12px; position:relative; z-index:1; animation:tutBounce 2s ease-in-out infinite; }
@keyframes tutBounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-7px)} }
.tut-welcome-hero h2 { margin:0; font-size:22px; font-weight:800; color:#fff; position:relative; z-index:1; }
.tut-welcome-hero p { margin:8px 0 0; font-size:13px; color:rgba(255,255,255,0.85); position:relative; z-index:1; }
.tut-welcome-body { padding:20px 28px 6px; }
.tut-welcome-body p { font-size:14px; line-height:1.7; color:var(--text-sub); margin:0 0 14px; }
.tut-welcome-list { display:flex; flex-direction:column; gap:8px; margin-bottom:4px; }
.tut-welcome-item { display:flex; align-items:center; gap:10px; padding:9px 12px; background:#f9fafb; border-radius:10px; }
.tut-welcome-item .wi-icon { font-size:20px; width:32px; text-align:center; }
.tut-welcome-item .wi-text { font-size:13px; color:#374151; }
.tut-welcome-item .wi-text b { display:block; }
.tut-welcome-item .wi-text span { font-size:12px; color:#9ca3af; }
.tut-welcome-footer { padding:16px 28px; display:flex; align-items:center; justify-content:space-between; border-top:1px solid #f3f4f6; }

.tut-mask { position:fixed; inset:0; z-index:9990; pointer-events:none; opacity:0; transition:opacity 0.35s ease; }
.tut-mask.active { opacity:1; pointer-events:auto; }
.tut-mask-top,.tut-mask-bottom,.tut-mask-left,.tut-mask-right { position:absolute; background:rgba(45,52,54,0.55); transition:all 0.35s ease; pointer-events:none; }
.tut-mask.active .tut-mask-top,.tut-mask.active .tut-mask-bottom,.tut-mask.active .tut-mask-left,.tut-mask.active .tut-mask-right { pointer-events:auto; }
.tut-mask-top { top:0; left:0; right:0; }
.tut-mask-bottom { bottom:0; left:0; right:0; }
.tut-mask-left { left:0; }
.tut-mask-right { right:0; }

.tut-highlight-ring { position:fixed; z-index:9991; border-radius:14px; box-shadow:0 0 0 3px #B7A6DD,0 0 0 7px rgba(183,166,221,0.3),0 8px 32px rgba(138,115,187,0.4); pointer-events:none; opacity:0; transition:all 0.35s var(--spring); animation:tutRingPulse 2s ease-in-out infinite; }
.tut-highlight-ring.active { opacity:1; }
@keyframes tutRingPulse { 0%,100%{box-shadow:0 0 0 3px #B7A6DD,0 0 0 7px rgba(183,166,221,0.3),0 8px 32px rgba(138,115,187,0.35)} 50%{box-shadow:0 0 0 3px #8A73BB,0 0 0 12px rgba(138,115,187,0.2),0 8px 40px rgba(107,33,94,0.5)} }

const AppContext = createContext(null);

const appReducer = (state, action) => {
  switch(action.type) {
    case 'SET_TAB':         return { ...state, currentTab: action.tab, isEditorOpen: true };
    case 'SET_TAB_PREVIEW': return { ...state, currentTab: action.tab };
    case 'TOGGLE_EDITOR':   return { ...state, isEditorOpen: !state.isEditorOpen };
    case 'OPEN_EDITOR':     return { ...state, isEditorOpen: true };
    case 'CLOSE_EDITOR':    return { ...state, isEditorOpen: false };
    case 'TOGGLE_PANEL':    return { ...state, isPanelOpen: !state.isPanelOpen };
    case 'SET_EDIT_MODE':   return { ...state, editMode: action.value };
    case 'SET_MODAL':       return { ...state, modal: { type: action.modalType, data: action.data || null } };
    case 'CLOSE_MODAL':     return { ...state, modal: { type: null, data: null } };
    case 'AI_START':        return { ...state, aiDraft: { text: '', loading: true, context: action.context, _targetGalleryId: action.targetId || null } };
    case 'AI_CHUNK':        return { ...state, aiDraft: { ...state.aiDraft, text: state.aiDraft.text + action.text, loading: !action.done } };
    case 'AI_DONE':         return { ...state, aiDraft: { ...state.aiDraft, loading: false } };
    case 'AI_CLEAR':        return { ...state, aiDraft: { text: '', loading: false, context: null, _targetGalleryId: null } };
    case 'FULLSCREEN_ON':   return { ...state, fullscreenMode: true };
    case 'FULLSCREEN_OFF':  return { ...state, fullscreenMode: false };
    default: return state;
  }
};

  tutorial: { active: false, currentStep: 0 },
  fullscreenMode: false
};

};

// ---------- DataContext (Bridge to Plain JS modules) ----------
const DataContext = createContext(null);

const DataProvider = ({ children }) => {
  const [version, setVersion] = useState(0);
  const [loaded, setLoaded] = useState(false);
  const forceUpdate = useCallback(() => setVersion(v => v + 1), []);

  // Data accessors
  const celebrity = useMemo(() => (window.AppState && window.AppState.data ? window.AppState.data.celebrity : {}), [version, loaded]);
  const news = useMemo(() => (window.AppState && window.AppState.data ? window.AppState.data.news : []), [version, loaded]);
  const gallery = useMemo(() => (window.AppState && window.AppState.data ? window.AppState.data.gallery : []), [version, loaded]);
  const community = useMemo(() => (window.AppState && window.AppState.data ? window.AppState.data.community : []), [version, loaded]);
  const calendar = useMemo(() => (window.AppState && window.AppState.data ? window.AppState.data.calendar : []), [version, loaded]);
  const shop = useMemo(() => (window.AppState && window.AppState.data ? window.AppState.data.shop : []), [version, loaded]);

  // Site Manager
  const sites = useMemo(() => (window.SiteManager ? window.SiteManager.getAll() : []), [version, loaded]);
  const activeSite = useMemo(() => (window.SiteManager ? window.SiteManager.getActive() : null), [version, loaded]);

  // Template
  const selectedTemplate = useMemo(() => (window.TemplateStore ? window.TemplateStore.selectedTemplate : 'default'), [version, loaded]);
  const selectedEffects = useMemo(() => (window.TemplateStore ? window.TemplateStore.selectedEffects : []), [version, loaded]);
  const paidItems = useMemo(() => (window.TemplateStore ? window.TemplateStore.paidItems : []), [version, loaded]);
  const templates = useMemo(() => (window.TemplateStore ? window.TemplateStore.templates : []), [version, loaded]);
  const effects = useMemo(() => (window.TemplateStore ? window.TemplateStore.effects : []), [version, loaded]);

  // CRUD: Celebrity
  const updateCelebrity = useCallback((path, value) => {
    window.AppState.update('celebrity', path, value);
    if (path === 'bgType' && window.BackgroundFX) window.BackgroundFX.setType(value);
    forceUpdate();
  }, [forceUpdate]);

  const uploadAvatar = useCallback(async (file) => {
    if (!file) return;
    if (file.size > 50*1024*1024) { alert('图片请≤50MB'); return; }
    const reader = new FileReader();
    reader.onload = async (e) => {
      window.AppState.update('celebrity', 'avatar', e.target.result);
      await window.AssetDB.save('avatar', e.target.result);
      forceUpdate();
    };
    reader.readAsDataURL(file);
  }, [forceUpdate]);

  // CRUD: News
  const addNews = useCallback(async (item) => {
    const id = 'n' + Date.now().toString(36);
    const newItem = { id, ...item, images: item.images || [] };
    window.AppState.data.news.unshift(newItem);
    if (item.cover) await window.AssetDB.save('news_' + id, item.cover);
    window.AppState.save();
    forceUpdate();
  }, [forceUpdate]);

  const deleteNews = useCallback(async (id) => {
    if (!confirm('确定删除此追忆？')) return;
    window.AppState.data.news = window.AppState.data.news.filter(n => n.id !== id);
    window.AppState.save();
    await window.AssetDB.delete('news_' + id);
    forceUpdate();
  }, [forceUpdate]);

  // CRUD: Gallery
  const addGallery = useCallback(async (files) => {
    if (!files || !files.length) return;
    for (let f of files) {
      if (f.size > 50*1024*1024) { alert(f.name + ' 超过50MB，已跳过'); continue; }
      const id = 'g' + Date.now().toString(36) + Math.random().toString(36).substr(2,4);
      const reader = new FileReader();
      reader.onload = async (e) => {
        const url = e.target.result;
        window.AppState.data.gallery.push({ id, caption: '', url });
        window.AppState.save();
        await window.AssetDB.save('gallery_' + id, url);
        forceUpdate();
      };
      reader.readAsDataURL(f);
    }
  }, [forceUpdate]);

  const deleteGallery = useCallback(async (id) => {
    if (!confirm('确定删除此照片？')) return;
    window.AppState.data.gallery = window.AppState.data.gallery.filter(g => g.id !== id);
    window.AppState.save();
    await window.AssetDB.delete('gallery_' + id);
    forceUpdate();
  }, [forceUpdate]);

  const updateGalleryCaption = useCallback((id, val) => {
    const item = window.AppState.data.gallery.find(g => g.id === id);
    if (item) { item.caption = val; window.AppState.save(); forceUpdate(); }
  }, [forceUpdate]);

  // CRUD: Community
  const addCommunity = useCallback((text) => {
    const now = new Date();
    const timeStr = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' + String(now.getDate()).padStart(2,'0') + ' ' + String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
    window.AppState.data.community.push({ text, time: timeStr });
    window.AppState.save();
    forceUpdate();
  }, [forceUpdate]);

  const deleteCommunity = useCallback((idx) => {
    window.AppState.data.community.splice(idx, 1);
    window.AppState.save();
    forceUpdate();
  }, [forceUpdate]);

  // CRUD: Calendar
  const addCalendarEvent = useCallback((ev) => {
    const id = 'ev' + Date.now().toString(36);
    window.AppState.data.calendar.push({ id, ...ev, registered: false });
    window.AppState.save();
    forceUpdate();
  }, [forceUpdate]);

  const deleteCalendarEvent = useCallback((id) => {
    if (!confirm('确定删除此活动？')) return;
    window.AppState.data.calendar = window.AppState.data.calendar.filter(ev => ev.id !== id);
    window.AppState.save();
    forceUpdate();
  }, [forceUpdate]);

  const toggleEventRegister = useCallback((id) => {
    const ev = window.AppState.data.calendar.find(e => e.id === id);
    if (!ev) return;
    ev.registered = !ev.registered;
    window.AppState.save();
    forceUpdate();
  }, [forceUpdate]);

  // CRUD: Shop
  const addShopItem = useCallback(async (item, imageFile) => {
    const id = 'sp' + Date.now().toString(36);
    const newItem = { id, ...item };
    if (imageFile) {
      if (imageFile.size > 50*1024*1024) { alert('图片请≤50MB'); return; }
      const reader = new FileReader();
      reader.onload = async (e) => {
        newItem.image = e.target.result;
        window.AppState.data.shop.push(newItem);
        window.AppState.save();
        forceUpdate();
      };
      reader.readAsDataURL(imageFile);
    } else {
      window.AppState.data.shop.push(newItem);
      window.AppState.save();
      forceUpdate();
    }
  }, [forceUpdate]);

  const deleteShopItem = useCallback(async (id) => {
    if (!confirm('确定删除此收藏？')) return;
    await window.AssetDB.delete('shop_' + id);
    window.AppState.data.shop = window.AppState.data.shop.filter(s => s.id !== id);
    window.AppState.save();
    forceUpdate();
  }, [forceUpdate]);

  // Site Manager
  const switchSite = useCallback((id) => {
    window.AppState.save();
    window._isSwitching = true;
    window.SiteManager.setActive(id);
    location.reload();
  }, []);

  const createSite = useCallback((name) => {
    if (!name || !name.trim()) return;
    window.AppState.save();
    window._isSwitching = true;
    window.SiteManager.create(name.trim());
    location.reload();
  }, []);

  const deleteSite = useCallback((id) => {
    const list = window.SiteManager.getAll();
    const site = list.find(s => s.id === id);
    const label = site ? site.name : '这个粉丝站';
    if (!confirm('确定删除"' + label + '"？所有数据将无法恢复！')) return;
    if (window.SiteManager.getActive() === id) window.AppState.save();
    window._isSwitching = true;
    window.SiteManager.remove(id);
    location.reload();
  }, []);

  // AIService
  const aiGenerate = useCallback(async (type, params, dispatch) => {
    const draft = window.AppState.aiDraft;
    if (draft.loading) return;
    let prompt = '';
    let context = '';
    if (type === 'bio') {
      const name = params.name || window.AppState.data.celebrity.name;
      if (!name) { alert('请先输入偶像名字'); return; }
      prompt = window.AIService.prompts.bio(name);
      context = '生成个人简介';
    } else if (type === 'news') {
      if (!params.title) { alert('请先输入追忆标题'); return; }
      prompt = window.AIService.prompts.news(params.title, params.date || '今日');
      context = '生成追忆正文';
    } else if (type === 'gallery') {
      const count = window.AppState.data.gallery.length;
      if (!count) { alert('请先上传照片'); return; }
      prompt = window.AIService.prompts.gallery(count);
      context = '生成画廊图注';
    } else if (type === 'caption') {
      prompt = '请为一张偶像活动照片生成一句简短唯美的图注，8-12字，风格应援/纪实，只输出一句话，不要编号和解释。';
      context = 'AI 生成图注中...';
    }
    dispatch({ type: 'AI_START', context, targetId: params.targetId || null });
    await window.AIService.generate(prompt, (chunk, isDone) => {
      dispatch({ type: 'AI_CHUNK', text: chunk, done: isDone });
    });
    dispatch({ type: 'AI_DONE' });
  }, []);

  // Template
  const selectTemplate = useCallback((id) => {
    window.TemplateStore.toggleTemplate(id);
    forceUpdate();
  }, [forceUpdate]);

  const toggleEffect = useCallback((id) => {
    window.TemplateStore.toggleEffect(id);
    forceUpdate();
  }, [forceUpdate]);

  const getTemplateTotal = useCallback(() => {
    return window.TemplateStore ? window.TemplateStore.getTotal() : 0;
  }, []);

  // Export
  const exportReadOnly = useCallback(async () => {
    const btn = document.querySelector('.btn-export');
    const ori = btn ? btn.innerText : '导出展示版';
    if (btn) { btn.innerText = '打包中...'; btn.disabled = true; }
    try {
      await window.TemplateStore.checkBeforeExport('readonly');
    } catch(e) {
      alert('导出失败：' + e.message);
    }
    setTimeout(() => { if (btn) { btn.innerText = ori; btn.disabled = false; } }, 2500);
  }, []);

  const previewStyle = useCallback(() => {
    if (window.TemplateStore) window.TemplateStore.previewStyle();
  }, []);

  // Init
  const loadData = useCallback(async () => {
    // First-time site creation + old data migration (from init.js)
    if (window.SiteManager.getAll().length === 0) {
      const hasOldData = localStorage.getItem('starfan_data') || localStorage.getItem('starfan_tutorial_done');
      window.SiteManager.create('我的第一个粉丝站');
      if (hasOldData) {
        const oldData = localStorage.getItem('starfan_data');
        if (oldData) {
          localStorage.setItem(window.SiteManager.dataKey(), oldData);
          localStorage.removeItem('starfan_data');
        }
        const oldOpts = localStorage.getItem('starfan_template_opts');
        if (oldOpts) {
          localStorage.setItem(window.SiteManager.optsKey(), oldOpts);
          localStorage.removeItem('starfan_template_opts');
        }
        const oldTut = localStorage.getItem('starfan_tutorial_done');
        if (oldTut) {
          localStorage.setItem(window.SiteManager.PREFIX + (window.SiteManager.getActive() || 'default') + '_tutorial_done', oldTut);
          localStorage.removeItem('starfan_tutorial_done');
        }
        window._isNewUser = false;
      } else {
        window._isNewUser = true;
      }
    } else {
      const globalTut = localStorage.getItem('starfan_tutorial_done');
      if (globalTut) {
        const sites = window.SiteManager.getAll();
        sites.forEach(s => {
          const sk = window.SiteManager.PREFIX + s.id + '_tutorial_done';
          if (!localStorage.getItem(sk)) localStorage.setItem(sk, globalTut);
        });
        localStorage.removeItem('starfan_tutorial_done');
      }
    }
    await window.AppState.init();
    window.TemplateStore.init();
    setLoaded(true);
    forceUpdate();
  }, [forceUpdate]);

  // DataContext value
  const value = useMemo(() => ({
    celebrity, news, gallery, community, calendar, shop,
    sites, activeSite,
    selectedTemplate, selectedEffects, paidItems, templates, effects,
    updateCelebrity, uploadAvatar,
    addNews, deleteNews,
    addGallery, deleteGallery, updateGalleryCaption,
    addCommunity, deleteCommunity,
    addCalendarEvent, deleteCalendarEvent, toggleEventRegister,
    addShopItem, deleteShopItem,
    switchSite, createSite, deleteSite,
    aiGenerate,
    selectTemplate, toggleEffect, getTemplateTotal,
    exportReadOnly, previewStyle,
    loadData, loaded, forceUpdate
  }), [
    celebrity, news, gallery, community, calendar, shop,
    sites, activeSite,
    selectedTemplate, selectedEffects, paidItems, templates, effects,
    version, loaded
  ]);

  return <DataContext.Provider value={value}>{children}</DataContext.Provider>;
};

// useDrag - for FAB button
const useDrag = (initialPos = { left: 28, top: typeof window !== 'undefined' ? window.innerHeight - 88 : 600 }, posKey) => {
  const [position, setPosition] = useState(() => {
    if (posKey) {
      try {
        const saved = JSON.parse(localStorage.getItem(posKey));
        if (saved) return saved;
      } catch(e) {}
    }
    return initialPos;
  });
  const [dragging, setDragging] = useState(false);
  const startPos = useRef({ x: 0, y: 0, left: 0, top: 0 });
  const moved = useRef(false);

  const onDown = useCallback((cx, cy) => {
    setDragging(true);
    moved.current = false;
    startPos.current = { x: cx, y: cy, left: position.left, top: position.top };
  }, [position]);

  const onMove = useCallback((cx, cy) => {
    if (!dragging) return;
    const dx = cx - startPos.current.x;
    const dy = cy - startPos.current.y;
    if (!moved.current && (Math.abs(dx) > 5 || Math.abs(dy) > 5)) moved.current = true;
    if (moved.current) {
      setPosition({ left: startPos.current.left + dx, top: startPos.current.top + dy });
    }
  }, [dragging]);

  const onUp = useCallback(() => {
    if (!dragging) return;
    setDragging(false);
    if (moved.current) {
      const size = 60;
      const maxX = window.innerWidth - size;
      const maxY = window.innerHeight - size;
      const left = Math.max(0, Math.min(position.left, maxX));
      const top = Math.max(0, Math.min(position.top, maxY));
      setPosition({ left, top });
      if (posKey) localStorage.setItem(posKey, JSON.stringify({ left, top }));
    }
    return moved.current;
  }, [dragging, position, posKey]);

  return { position, dragging, moved, onDown, onMove, onUp };
};

// AIPanel (inside editor)
const AIPanel = () => {
  const { state, dispatch } = useContext(AppContext);
  const data = useContext(DataContext);
  const draft = state.aiDraft;

  if (!draft.loading && !draft.text) return null;

  const handleAccept = () => {
    const tab = state.currentTab;
    if (tab === 'celebrity') {
      data.updateCelebrity('bio', draft.text);
    } else if (tab === 'news') {
      const el = document.getElementById('news_content');
      if (el) el.value = draft.text;
    } else if (tab === 'gallery') {
      if (draft._targetGalleryId) {
        const g = window.AppState.data.gallery.find(g => g.id === draft._targetGalleryId);
        if (g) { g.caption = draft.text.trim(); window.AppState.save(); data.forceUpdate(); }
      } else {
        const lines = draft.text.split('\n').filter(l => l.trim());
        window.AppState.data.gallery.forEach((g, i) => { if (lines[i]) g.caption = lines[i].trim(); });
        window.AppState.save(); data.forceUpdate();
      }
    }
    dispatch({ type: 'AI_CLEAR' });
  };

  return (
    <div className="ai-panel mt-4">
      <div className="flex justify-between items-center mb-3">
        <b className="text-[13px] text-ai">AI 生成中...</b>
        <span className="text-xs text-secondary">{draft.context || ''}</span>
      </div>
      <div className={"content " + (draft.loading ? 'typing-cursor' : '')}>
        {draft.text || '正在思考...'}
      </div>
      {!draft.loading && (
        <div className="flex gap-3 mt-3">
          <button className="btn-primary flex-1 m-0 text-xs !p-2" onClick={handleAccept}>采用内容</button>
          <button className="btn-ai flex-1 m-0 text-xs !p-2" onClick={() => data.aiGenerate(draft.context?.includes('简介') ? 'bio' : draft.context?.includes('追忆') ? 'news' : 'gallery', {}, dispatch)}>重新生成</button>
        </div>
      )}
    </div>
  );
};

  const posKey = useMemo(() => {
    return window.SiteManager ? (window.SiteManager.PREFIX + (window.SiteManager.getActive() || 'default') + '_btnpos') : null;
  }, []);
  const { position, dragging, moved, onDown, onMove, onUp } = useDrag({ left: 28, right: 'auto', bottom: 28, top: 'auto' }, posKey);
  const [clickConsumed, setClickConsumed] = useState(false);

  // Restore saved position
  useEffect(() => {
    if (!posKey) return;
    const saved = localStorage.getItem(posKey);
    if (saved) {
      try {
        const pos = JSON.parse(saved);
        // update position state - handled by useDrag initializer
      } catch(e) {}
    }
  }, [posKey]);

  return (
    <button
      className={"fab-btn " + (dragging ? 'dragging' : '')}
      style={{ bottom: position.bottom || position.top || 28, right: position.right || 28, left: position.left || 'auto', top: 'auto' }}
      onMouseDown={(e) => { onDown(e.clientX, e.clientY); }}
      onTouchStart={(e) => { const t = e.touches[0]; onDown(t.clientX, t.clientY); }}
      onClick={(e) => {
        if (clickConsumed) { setClickConsumed(false); return; }

// ---------- CalendarView (Mini Calendar + Timeline) ----------
const CalendarView = memo(() => {
  const { dispatch } = useContext(AppContext);
  const data = useContext(DataContext);
  const [viewDate, setViewDate] = useState(new Date());
  const [selectedDate, setSelectedDate] = useState(null);

  const y = viewDate.getFullYear();
  const m = viewDate.getMonth();
  const now = new Date();
  const monthNames = ['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];
  const dayNames = ['日','一','二','三','四','五','六'];
  const firstDay = new Date(y, m, 1).getDay();
  const daysInMonth = new Date(y, m+1, 0).getDate();
  const daysInPrev = new Date(y, m, 0).getDate();

  // Build calendar cells
  const cells = [];
  for (let i = firstDay-1; i >= 0; i--) {
    cells.push({ date: daysInPrev - i, type: 'other', dateStr: '' });
  }
  for (let d = 1; d <= daysInMonth; d++) {
    const ds = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isToday = now.getFullYear() === y && now.getMonth() === m && now.getDate() === d;
    const isSel = selectedDate === ds;
    const hasEv = (data.calendar || []).some(e => e.date === ds);
    cells.push({ date: d, type: isToday ? 'today' : 'normal', dateStr: ds, isSel, hasEv });
  }
  const totalCells = Math.ceil((firstDay + daysInMonth) / 7) * 7;
  for (let i = firstDay + daysInMonth; i < totalCells; i++) {
    cells.push({ date: i - firstDay - daysInMonth + 1, type: 'other', dateStr: '' });
  }

  const filteredEvents = selectedDate
    ? (data.calendar || []).filter(e => e.date === selectedDate)
    : (data.calendar || []).sort((a, b) => a.date.localeCompare(b.date));

  const tagLabels = { concert: '演唱会', 'fan-meet': '见面会', release: '新专发布', other: '其他' };
  const tagClass = { concert: 'event-tag-concert', 'fan-meet': 'event-tag-fanmeet', release: 'event-tag-release', other: 'event-tag-other' };

  return (
    <div>
      <SectionHeader title="活动日历" onAdd={() => dispatch({ type: 'SET_TAB', tab: 'calendar' })} addLabel="添加活动">
        {selectedDate && <button className="inline-btn" onClick={() => setSelectedDate(null)}>📋 全部活动</button>}
      </SectionHeader>

      {/* Mini Calendar */}
      <div className="calendar-wrap">
        <div className="cal-header">
          <button className="cal-nav" onClick={() => setViewDate(new Date(y, m-1, 1))}>‹</button>
          <h3>{y}年 {monthNames[m]}</h3>
          <button className="cal-nav" onClick={() => setViewDate(new Date(y, m+1, 1))}>›</button>
        </div>
        <div className="cal-grid">
          {dayNames.map(d => <div key={d} className="cal-day-name">{d}</div>)}
          {cells.map((cell, i) => (
            <div key={i}
              className={"cal-cell " + (cell.type === 'other' ? 'other-month' : '') + (cell.type === 'today' ? 'today' : '') + (cell.isSel ? 'selected' : '')}
              onClick={() => cell.type !== 'other' ? setSelectedDate(cell.isSel ? null : cell.dateStr) : null}>
              <div className="cal-date">{cell.date}</div>
              {cell.hasEv && <span className="cal-dot"></span>}
            </div>
          ))}
        </div>
      </div>

      {/* Event Timeline */}
      {(!data.calendar || !data.calendar.length) ? (
        <EmptyState type="calendar" description="暂无活动，点击上方按钮添加" />
      ) : !filteredEvents.length ? (
        <div className="empty-state">{selectedDate ? '当天暂无活动' : '暂无活动'}</div>
      ) : (
        <div className="flex flex-col gap-3">
          {filteredEvents.map(ev => {
            const [, em, ed] = ev.date.split('-');
            return (
              <div key={ev.id} className="event-card">
                <button className="inline-del-btn" onClick={(e) => { e.stopPropagation(); data.deleteCalendarEvent(ev.id); }}>✕</button>
                <div className="event-date-badge">
                  <div className="event-badge-month">{parseInt(em)}月</div>
                  <div className="event-badge-day">{parseInt(ed)}</div>
                </div>
                <div className="flex-1">
                  <h4 className="text-[15px] font-bold text-text m-0 mb-1">{ev.name}</h4>
                  {ev.venue && <div className="text-[13px] text-secondary">📍 {ev.venue}</div>}
                  {ev.desc && <div className="text-[13px] text-secondary mt-1">{ev.desc}</div>}
                  <span className={"event-tag-label " + (tagClass[ev.type] || 'event-tag-other')}>{tagLabels[ev.type] || ev.type}</span>
                  <div>
                    <button className={"register-btn " + (ev.registered ? 'registered' : '')} onClick={() => data.toggleEventRegister(ev.id)}>
                      {ev.registered ? '✅ 已报名' : '🎫 立即报名'}
                    </button>
                  </div>
                </div>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
});

// ---------- ShopView ----------
const ShopView = memo(() => {
  const { dispatch } = useContext(AppContext);
  const data = useContext(DataContext);
  const [currentCat, setCurrentCat] = useState('全部');

  const categories = useMemo(() => {
    const cats = new Set((data.shop || []).map(i => i.cat));

// ---------- NewsEditor ----------
const NewsEditor = () => {
  const { dispatch } = useContext(AppContext);
  const data = useContext(DataContext);
  const [title, setTitle] = useState('');
  const [date, setDate] = useState('');
  const [content, setContent] = useState('');
  const [coverFile, setCoverFile] = useState(null);
  const [extraFiles, setExtraFiles] = useState(null);
  const [editingId, setEditingId] = useState(null);

  const handleSave = async () => {
    if (!title.trim()) { alert('请填写追忆标题'); return; }
    const item = {
      title: title.trim(),
      date: date || new Date().toISOString().split('T')[0],
      content: content.trim(),
      cover: '',
      images: []
    };
    if (coverFile) {
      const reader = new FileReader();
      reader.onload = async (e) => {
        item.cover = e.target.result;
        await data.addNews(item);
        resetForm();
      };
      reader.readAsDataURL(coverFile);
    } else {
      await data.addNews(item);
      resetForm();
    }
  };

  const resetForm = () => {
    setTitle(''); setDate(''); setContent(''); setCoverFile(null); setExtraFiles(null); setEditingId(null);
  };

  const handleEdit = (item) => {
    setEditingId(item.id);
    setTitle(item.title);
    setDate(item.date);
    setContent(item.content);
  };

  return (
    <div>
      <FormGroup label="追忆标题">
        <input id="news_title" value={title} onChange={e => setTitle(e.target.value)} placeholder="如：第一次看演唱会" />
      </FormGroup>
      <FormGroup label="追忆日期">
        <input type="date" id="news_date" value={date} onChange={e => setDate(e.target.value)} />
      </FormGroup>
      <FormGroup label="正文内容">
        <textarea id="news_content" rows="4" value={content} onChange={e => setContent(e.target.value)} placeholder="记录当时的心情和细节..."></textarea>
      </FormGroup>
      <button className="btn-ai" onClick={() => data.aiGenerate('news', { title, date }, dispatch)}>🤖 AI 帮写</button>
      <FormGroup label="封面图">
        <input type="file" accept="image/*" onChange={e => setCoverFile(e.target.files[0])} />
      </FormGroup>
      <FormGroup label="更多照片（最多9张，每张≤50MB）">
        <input type="file" accept="image/*" multiple onChange={e => setExtraFiles(e.target.files)} />
      </FormGroup>
      <div className="flex gap-2">
        <button className="btn-primary flex-1" onClick={handleSave}>{editingId ? '保存修改' : '添加追忆'}</button>
        {editingId && <button className="btn-danger flex-[0.4]" onClick={resetForm}>取消</button>}
      </div>
      <EditorItemList items={data.news} emptyText="暂无追忆"
        renderItem={(item) => (
          <div key={item.id} className="item-card" style={editingId === item.id ? {border:'2px solid var(--primary)',background:'#f0f7ff'} : {}}>
            <div className="flex-1">
              <b className="text-xs text-text block mb-0.5">{item.title}</b>
              <span className="text-[11px] text-secondary">{item.date}</span>
            </div>
            <div className="flex gap-1.5">
              <button className="btn-small" onClick={() => handleEdit(item)}>编辑</button>
              <button className="btn-small btn-danger" onClick={() => data.deleteNews(item.id)}>删除</button>
            </div>
          </div>
        )} />
    </div>
  );
};
